# Met en ligne le serveur de l'appli commerciale Fitzora (dossier functions-orvea/ et orvea/firestore.rules).
# Séparé de l'appli privée NN Coaching : base Firestore nommée « orvea », fonctions dans le codebase « orvea ».
# Utilise les mêmes secrets que l'assistant privé (FIREBASE_SA, ANTHROPIC_API_KEY). Sans secrets, rien ne se passe.
name: Fitzora (serveur)
on:
  push:
    branches: [gh-pages]
    paths: ["functions-orvea/**", "orvea/firestore.rules", ".github/workflows/orvea.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: orvea
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJET: nn-coaching-bd311
      BASE: orvea
      PRET: ${{ secrets.FIREBASE_SA != '' && secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Secrets présents ?
        if: env.PRET != 'true'
        run: echo "::notice::Secrets FIREBASE_SA ou ANTHROPIC_API_KEY absents, rien à mettre en ligne."
      - uses: actions/checkout@v4
        if: env.PRET == 'true'
      - uses: actions/setup-node@v4
        if: env.PRET == 'true'
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        if: env.PRET == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: env.PRET == 'true'
      - name: Base Firestore « orvea » (créée une fois, en Europe)
        if: env.PRET == 'true'
        run: |
          if ! gcloud firestore databases describe --database="$BASE" --project "$PROJET" >/dev/null 2>&1; then
            gcloud services enable cloudscheduler.googleapis.com --project "$PROJET" || true
            gcloud firestore databases create --database="$BASE" --location=eur3 --type=firestore-native --project "$PROJET"
          fi
          echo "REGION=europe-west1" > functions-orvea/.env
      - name: Dépendances
        if: env.PRET == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: functions-orvea
      - name: Règles de la base
        if: env.PRET == 'true'
        run: npx -y firebase-tools@15 deploy --only firestore:rules --project "$PROJET" --non-interactive --force
      - name: Fonctions
        if: env.PRET == 'true'
        run: |
          npx -y firebase-tools@15 deploy --only functions:orvea --project "$PROJET" --non-interactive --force \
            || (sleep 60 && npx -y firebase-tools@15 deploy --only functions:orvea --project "$PROJET" --non-interactive --force)
