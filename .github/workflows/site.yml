# Publie le site (appli privée NN Coaching + Orvéa) à partir du dépôt privé :
# seulement les fichiers web, compactés (voir .github/site/build.mjs). Le code serveur n'est jamais publié.
# Ne fait rien tant que GitHub Pages n'est pas réglé sur « GitHub Actions » (Settings › Pages › Source).
name: Site (publication compactée)
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      actif: ${{ steps.mode.outputs.actif }}
    steps:
      - id: mode
        name: Pages en mode « GitHub Actions » ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "?")
          echo "Mode Pages : $t"
          if [ "$t" = "workflow" ]; then echo "actif=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Pages publie encore la branche directement ($t) : rien à faire."; fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.actif == 'true'
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.actif == 'true'
        with:
          node-version: 22
      - name: Compacter
        if: steps.mode.outputs.actif == 'true'
        run: |
          npm ci --prefix .github/site --no-audit --no-fund
          node .github/site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.actif == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.actif == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
