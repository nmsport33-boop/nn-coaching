/* --- feuilles --- */
function renderSheet(){
  const el = $("sheet"), sh = S.sheet;
  if (!sh) { el.hidden = true; el.innerHTML = ""; document.body.style.overflow = ""; return; }
  let title = "", body = "";
  if (sh.type === "seance") { const s = S.cur.seances[sh.sid]; title = s ? (Number.isInteger(s.num) ? `Séance ${s.num}` : "Séance") : "Séance"; body = s ? seanceBody(sh.sid, s) : `<div class="empty">Séance introuvable.</div>`; }
  if (sh.type === "bookfor") { title = "Placer un adhérent"; body = bookforBody(sh.k); }
  if (sh.type === "cycle") { title = "Macro-cycle"; body = cycleForm(); }
  if (sh.type === "member") { title = sh.mid ? "Modifier la fiche" : "Nouvel adhérent"; body = memberForm(sh.mid); }
  if (sh.type === "custom") { title = "Autre heure"; body = customBody(); }
  if (sh.type === "link") { title = "Relier à une fiche"; body = linkBody(); }
  if (sh.type === "board") { title = "Tableau de la salle"; body = boardBody(); }
  const keepScroll = !el.hidden && el.dataset.k === sh.type + (sh.sid||"") ? el.scrollTop : 0;
  el.dataset.k = sh.type + (sh.sid||"");
  el.innerHTML = `<div class="sheet-top"><div class="in"><h2>${esc(title)}</h2><button class="x" data-a="close">Fermer</button></div></div><main>${body}</main>`;
  el.hidden = false; el.scrollTop = keepScroll; document.body.style.overflow = "hidden";
}

function seanceBody(sid, s){
  const m = S.cur.member || {}, coach = S.owner, list = seancesSorted();
  const prev = list.filter(x => x.num < s.num).pop();
  const prevNotes = prev ? S.cur.notes.filter(n => n.seance === prev.id && n.suivante) : [];
  const pi = phaseOf(m.cycle, s.num);
  let out = `<section class="sec"><span class="eyebrow">${esc(m.prenom || "")}${pi>=0 ? " · " + esc(m.cycle.phases[pi].nom) : ""}</span>
    <h2 style="font-size:28px">${esc(s.titre || "Séance " + s.num)}</h2>
    <div class="row"><span class="chip">${esc(lieuLbl(s))}</span>${s.date ? `<span class="chip">${esc(fmtLong(parseIso(s.date)) + heureLbl(s.heure))}</span>` : s.semaine ? `<span class="chip">Semaine ${s.semaine}</span>` : ""}
      ${s.statut==="faite" ? `<span class="chip ok">Faite</span>` : `<span class="chip gold">Prévue</span>`}</div></section>`;
  if (coach && isAuto(s) && !s.visible) out += `<section class="sec"><div class="banner ${s.visible ? "" : "mag"}" style="flex-direction:column;align-items:flex-start">
    ${s.visible ? `<span><b>${esc(m.prenom || "L'adhérent")} voit cette séance</b> depuis son appli et peut cocher ses exercices.</span>`
      : `<span><b>${esc(m.prenom || "L'adhérent")} ne voit pas encore cette séance.</b> Après votre séance et le compte rendu, ajuste-la puis débloque-la.</span>`}
    <div class="row">${s.visible ? `<button class="btn sm ghost" data-a="visible" data-v="${sid}" data-k="0">Cacher à nouveau</button>`
      : `<button class="btn sm ghost" data-a="edit-blocs">Ajuster</button><button class="btn sm solid" data-a="visible" data-v="${sid}" data-k="1">Débloquer pour ${esc(m.prenom || "l'adhérent")}</button>`}</div></div></section>`;
  if (coach && !isAuto(s)) { const nxt = allSeances().find(x => x.num > s.num);
    if (nxt && isAuto(nxt) && !nxt.visible) out += `<section class="sec"><div class="banner" style="flex-direction:column;align-items:flex-start">
      <span><b>Après le compte rendu :</b> prépare la séance ${nxt.num} en autonomie à partir de ce que vous venez de dire, puis débloque-la.</span>
      <button class="btn sm solid" data-a="prep-auto" data-v="${nxt.id}">Préparer la séance ${nxt.num}</button></div></section>`; }
  if (isAuto(s) && (coach || s.visible) && s.statut !== "faite") { const pk = "pl." + sid + ".";
    out += `<section class="sec"><div class="card"><b>Quand vas-tu la faire ?</b>
      <span class="small muted">Choisis le jour et l'heure qui t'arrangent, même en dehors des créneaux de Nathanael.</span>
      <div class="grid3"><label class="f" style="grid-column:span 2">Jour<input type="date" id="pd-${sid}" data-d="${pk}date" value="${esc(d(pk+"date", s.date||""))}"></label>
      <label class="f">Heure<input type="time" id="ph-${sid}" data-d="${pk}heure" value="${esc(d(pk+"heure", s.heure||""))}"></label></div>
      <div class="row"><button class="btn solid" data-a="plan" data-v="${sid}" ${S.writeBlocked?"disabled":""}>${s.date ? "Changer la date" : "Programmer"}</button>
      ${gcalSeance(s) ? `<a class="btn ghost" href="${esc(gcalSeance(s))}" target="_blank" rel="noopener">+ Google Agenda</a>` : ""}</div></div></section>`; }
  if (prev && (prevNotes.length || hasAlert(prev))) {
    const r = prev.ressenti || {};
    out += `<section class="sec"><div class="banner ${hasAlert(prev)?"warn":""}" style="flex-direction:column;align-items:flex-start">
      <b>À prendre en compte (séance ${prev.num})</b>
      ${hasAlert(prev) ? `<span>Ressenti : douleur anormale ${r.pendant ?? "–"}/10 pendant, ${r.lendemain ?? "–"}/10 le lendemain${r.ou ? " (" + esc(r.ou) + ")" : ""}${r.gonfle ? ", genou gonflé" : ""}. Règle : 3/10 max, sinon on réduit l'amplitude ou on reprend la séance d'avant.</span>` : ""}
      ${prevNotes.map(n => `<span>« ${esc(n.texte)} » <span class="muted small">(${n.auteur==="coach"?"coach":esc(m.prenom||"adhérent")})</span></span>`).join("")}</div></section>`;
  }
  if (!(S.edit && coach)) out += `<section class="sec">${goBtn(sid, s)}</section>`;
  if (S.edit && coach) out += blocsForm(s);
  else {
    const co = s.coches || {}, tot = (s.blocs||[]).reduce((t,b) => t + (b.exos||[]).length, 0);
    const nbOk = (s.blocs||[]).reduce((t,b,bi) => t + (b.exos||[]).filter((_,ei) => exoFait(s,bi,ei,b)).length, 0);
    out += `<section class="sec"><div class="sec-h"><h2>Programme</h2><div class="row">${tot ? `<button class="btn sm ink" data-a="project" data-v="seance" data-k="${sid}">▶ Projeter</button>` : ""}${coach ? `<button class="btn sm ghost" data-a="edit-blocs">Modifier</button>` : tot ? `<span class="chip ${nbOk===tot?"ok":""}">${nbOk} / ${tot} cochés</span>` : ""}</div></div>
      ${tot ? `<p class="small muted" style="margin:0">« Projeter » affiche la séance en grand, fond noir, pour un écran ou une télé pendant que tu la fais.</p>` : ""}
      ${!coach && tot ? `<p class="small muted" style="margin:0">Un rond par tour sur chaque exo : coche le 1 après ton premier passage, le 2 au suivant… Quand tous les exos d'un tour sont cochés, le repos démarre tout seul.</p>` : ""}
      ${(s.blocs||[]).map((b,bi) => `<div class="bloc"><div class="bloc-h"><b>${esc(b.code)}${b.nom ? " · " + esc(b.nom) : ""}</b><span>${esc(b.tours||"")}</span></div>${tourBar(s, sid, b, bi)}
        ${(b.exos||[]).length ? b.exos.map((e,ei) => `<div class="ex ${exoFait(s,bi,ei,b)?"done":""} ${nbTours(b.tours)>=2?"multi":""}">${nbTours(b.tours)>=2 ? "" : `<button class="tick ${co[bi+"-"+ei]?"on":""}" data-a="coche" data-v="${sid}" data-k="${bi}-${ei}" aria-label="Cocher ${esc(e.n)}" aria-pressed="${co[bi+"-"+ei]?"true":"false"}">✓</button>`}<span class="n">${esc(e.n)}</span><span class="d">${esc(e.d||"")}</span>${/^https:\/\//.test(e.v||"") ? `<a class="vid" href="${esc(e.v)}" target="_blank" rel="noopener">VIDÉO</a>` : ""}${nbTours(b.tours)>=2 ? rondsExo(s, sid, b, bi, ei) : ""}</div>${chargeRow(s, sid, bi, ei, e)}<div class="exbas">${e.c ? `<details class="how"><summary>Comment faire</summary><p>${esc(e.c)}</p></details>` : ""}${remarqueRow(s, sid, bi, ei)}</div>`).join("") : `<div class="ex"><span class="n muted">À compléter</span></div>`}</div>`).join("")}</section>`;
  }
  // ressenti
  const r = s.ressenti || {}, k = "rs." + sid + ".";
  const sc = (f, hot) => `<div class="scale">${Array.from({length:11},(_,i) => `<button class="${d(k+f, r[f])===i?"on":""} ${hot&&i>3?"hot":""}" data-a="scale" data-f="${k+f}" data-v="${i}">${i}</button>`).join("")}</div>`;
  out += `<section class="sec" id="ressenti"><h2>Ressenti</h2><div class="card">
    <label class="f">Forme en début de séance (0 = épuisé, 10 = au top)</label>${sc("formeDebut")}
    <label class="f">Effort ressenti (0 = rien, 10 = maximal)</label>${sc("rpe")}
    <label class="f">Forme en fin d'entraînement (0 = vidé, 10 = au top)</label>${sc("formeFin")}
    <p class="small muted" style="margin:4px 0 0"><b>Douleur anormale</b> : pas les courbatures ni la brûlure du muscle qui travaille. Une douleur dans une articulation, qui pique, qui lance, ou qui ne ressemble pas à l'effort.</p>
    <label class="f">Douleur anormale pendant la séance /10</label>${sc("pendant", true)}
    <label class="f">Douleur anormale le lendemain matin /10</label>${sc("lendemain", true)}
    <label class="f">Où ? (si douleur anormale)<input id="ou-${sid}" data-d="${k}ou" maxlength="120" placeholder="Ex. genou gauche en descente" value="${esc(d(k+"ou", r.ou || ""))}"></label>
    <label class="check"><input type="checkbox" id="gf-${sid}" data-d="${k}gonfle" ${d(k+"gonfle", !!r.gonfle)?"checked":""}> Genou gonflé ou qui se dérobe</label>
    <p class="small muted" style="margin:0">Règle : 3/10 maximum pendant l'effort, et pas plus mal le lendemain. Si le genou gonfle, se bloque ou se dérobe plus souvent : avis médical.</p>
    <div class="row"><button class="btn solid" data-a="save-ressenti" data-v="${sid}" ${S.writeBlocked?"disabled":""}>Enregistrer le ressenti</button>
    ${coach ? `<button class="btn ${s.statut==="faite"?"ghost":"ink"}" data-a="toggle-faite" data-v="${sid}">${s.statut==="faite" ? "Remettre en prévue" : "Marquer comme faite"}</button>`
      : s.statut !== "faite" ? `<button class="btn ink" data-a="toggle-faite" data-v="${sid}">J'ai terminé ma séance</button>` : ""}</div></div></section>`;
  const notes = S.cur.notes.filter(n => n.seance === sid);
  out += `<section class="sec"><h2>Notes</h2>${notes.map(noteHtml).join("") || `<p class="small muted" style="margin:0">Pas encore de note sur cette séance.</p>`}${noteForm(sid)}</section>`;
  if (coach) out += `<section class="sec"><button class="btn ghost" data-a="del-seance" data-v="${sid}">${S.confirmDel===sid ? "Confirmer la suppression" : "Supprimer cette séance"}</button></section>`;
  return out;
}

/* --- séance guidée : un exo à la fois, dans l'ordre des blocs puis des tours ; mêmes coches que la liste --- */
function etapes(s){ const out = [];
  (s.blocs || []).forEach((b, bi) => { const ex = b.exos || [], n = nbTours(b.tours); if (!ex.length) return;
    if (n >= 2) { for (let t = 1; t <= n; t++) ex.forEach((e, ei) => out.push({bi, ei, t, n, b, e, k: `${bi}-${ei}-t${t}`, a: "rond", ok: rondOn(s, bi, ei, t)})); }
    else ex.forEach((e, ei) => out.push({bi, ei, t: 1, n: 1, b, e, k: `${bi}-${ei}`, a: "coche", ok: !!(s.coches || {})[`${bi}-${ei}`]})); });
  return out; }
function goBtn(sid, s){ const st = etapes(s); if (!st.length) return "";
  const fait = st.filter(x => x.ok).length, fini = fait === st.length;
  return `<button class="btn xl ${fini ? "light" : ""}" data-a="go" data-v="${sid}">${fini ? "↺ Revoir la séance" : fait ? "▶ Reprendre la séance" : "▶ Commencer la séance"}</button>`; }
const mmss = sec => `${Math.floor(sec / 60)}:${pad(sec % 60)}`;
function renderGo(){
  const el = $("go"), g = S.go, s = g && S.cur.seances?.[g.sid];
  if (!g || !s) { el.hidden = true; el.innerHTML = ""; document.body.classList.remove("going"); return; }
  document.body.classList.add("going");
  const st = etapes(s), fait = st.filter(x => x.ok).length, pct = st.length ? Math.round(fait / st.length * 100) : 0;
  const top = `<div class="go-top"><button class="go-x" data-a="go-close" aria-label="Quitter">✕</button><div class="go-prog"><i style="width:${pct}%"></i></div><span class="go-cnt">${fait} / ${st.length}</span><button class="go-x ecr" data-a="go-cast" data-v="${g.sid}" aria-label="Projeter sur une télé">${CAST}</button></div>`;
  const panel = g.panel ? panneauEcran(g.sid) : "";
  if (s.focus && s.focus !== g.vu) { g.vu = s.focus;   /* l'écran projeté a avancé : le téléphone suit */
    if (s.focusBy && s.focusBy !== dev()) { const j = st.findIndex(y => y.k === s.focus); if (j >= 0) { g.i = j; g.focus = s.focus; } } }
  if (g.i == null || g.i >= st.length) g.i = Math.max(0, st.findIndex(x => !x.ok));
  if (fait === st.length && g.fin) {
    el.innerHTML = `${panel}<div class="in">${top}<div class="go-fin"><div style="font-size:64px">🏆</div><h3>Séance terminée !</h3><p>Énorme. Dis à Nathanael comment ça s'est passé : 30 secondes, et il ajuste la suite.</p>
      <button class="btn xl gold" data-a="go-ressenti">Donner mon ressenti</button><button class="btn link" data-a="go-close" style="color:#bdbbb2">Fermer</button></div></div>`;
    el.hidden = false; return; }
  const x = st[g.i], b = x.b, e = x.e, r = S.repos, left = r ? Math.ceil((r.fin - Date.now()) / 1000) : 0;
  const suiv = st.slice(g.i + 1).find(y => !y.ok);
  const tours = x.n >= 2 ? `<div class="go-tours">${Array.from({length: x.n}, (_, i) => `<i class="${i + 1 < x.t || toursComplets(s, x.bi, b) > i ? "on" : ""} ${i + 1 === x.t ? "cur" : ""}"></i>`).join("")}<span>Tour ${x.t} / ${x.n}</span></div>` : "";
  if (g.focus !== x.k) focusSur(g.sid, x.k);
  const bloc = `<div class="go-bloc"><span class="code">${esc(/^fin/i.test(b.code) ? "Finisher" : b.code)}${b.nom ? " · " + esc(b.nom) : ""}</span>${tours}</div>`;
  const c = S.chrono?.sid === g.sid && S.chrono.k === x.k ? S.chrono : null;
  if (r?.sid === g.sid && left > 0 && !c) {   /* repos : tout l'écran, puis l'exo suivant arrive tout seul */
    el.innerHTML = `${panel}<div class="in">${top}${bloc}<div class="go-rest"><span class="go-lbl">${esc(r.lbl || "Repos")}</span>
      <div class="go-ring">${ring("rep", (r.fin - Date.now()) / (r.dur || 60000))}<b class="rep-t">${mmss(left)}</b></div>
      <div class="go-suiv"><span>À suivre</span><b>${esc(e.n)}</b>${e.d ? `<i>${esc(e.d)}</i>` : ""}</div>
      <div class="go-rbtn"><button data-a="repos-plus">+15 s</button><button class="pass" data-a="repos-stop">Passer le repos ›</button></div></div></div>`;
    el.hidden = false; return; }
  if (c) {   /* exo en temps : gros chrono, il se coche tout seul à la fin */
    el.innerHTML = `${panel}<div class="in">${top}${bloc}<div class="go-rest chr ${c.ph}"><span class="go-lbl">${chronoLbl(c)}</span><h3>${esc(e.n)}</h3>
      <div class="go-ring">${ring("chr", chronoFrac(c))}<b class="chr-t">${chronoTxt(c)}</b></div>
      <div class="go-rbtn"><button data-a="chrono-stop">Annuler</button><button class="pass" data-a="go-fait" data-v="${g.sid}" data-k="${x.k}">✓ Terminé</button></div></div></div>`;
    el.hidden = false; return; }
  const t = !x.ok && dureeExo(e.d);
  el.innerHTML = `${panel}<div class="in">${top}${bloc}
    <div class="go-card"><h3>${esc(e.n)}</h3>${e.d ? `<div class="go-dose">${esc(e.d)}</div>` : ""}

/* exo en temps : "30 sec / jambe" -> 30 s x 2 côtés ; null si c'est en répétitions ("5 sec x10") */
function dureeExo(d){ const t = String(d || "").toLowerCase().replace(/^@\S+\s*/, "").split(/[·,]/)[0].trim();
  if (!t || /x\s*\d|\d\s*x\b|[(+]/.test(t)) return null;
  const [a, c = ""] = t.split("/").map(x => x.trim()); let m = a.match(/^(\d+)\s*(?:min|mn|')\s*(?:(\d+)\s*(?:s|sec|")?)?$/), sec;
  if (m) sec = Number(m[1]) * 60 + Number(m[2] || 0); else if ((m = a.match(/^(\d+)\s*(?:s|sec|secondes?|")$/))) sec = Number(m[1]); else return null;
  return sec >= 5 && sec <= 1800 ? {sec, sides: /^(c|côté|jambe|bras|main|pied)/.test(c) ? 2 : 1} : null; }
/* chrono : 3 s pour se placer, l'effort, 5 s pour changer de côté, puis l'exo se coche tout seul */
const chronoLbl = c => c.ph === "pret" ? "Mets-toi en place" : c.ph === "chg" ? "Change de côté" : c.sides > 1 ? `Côté ${c.side} / ${c.sides}` : "C'est parti";

const chronoTxt = c => { const l = Math.max(0, Math.ceil((c.fin - Date.now()) / 1000)); return l >= 60 ? mmss(l) : String(l); };
function startChrono(sid, k){ const s = S.cur.seances[sid], x = s && etapes(s).find(y => y.k === k), t = x && dureeExo(x.e.d); if (!t) return;
  if (S.repos) stopRepos(); audioOn();

  chronoPartage(); tickChrono(); }
function chronoPartage(){ const c = S.chrono; if (!c?.own || !S.db) return; c.at = Date.now();
  S.db.doc(`members/${c.mid}/seances/${c.sid}`).update({chrono: {k: c.k, fin: c.fin, dur: c.dur, ph: c.ph, side: c.side, sides: c.sides}}).catch(() => {}); }
function stopChrono(){ const c = S.chrono; S.chrono = null; clearInterval(S.chronoH); S.chronoH = null;
  if (c && S.db) S.db.doc(`members/${c.mid}/seances/${c.sid}`).update({chrono: firebase.firestore.FieldValue.delete()}).catch(() => {}); }
function tickChrono(){ const c = S.chrono; if (!c) { clearInterval(S.chronoH); S.chronoH = null; return; }
  if (!S.chronoH) S.chronoH = setInterval(tickChrono, 200);
  const ms = c.fin - Date.now(), left = Math.ceil(ms / 1000);

async function faireEtape(sid, k){ if (S.goBusy) return; const s0 = S.cur.seances[sid], x = s0 && etapes(s0).find(y => y.k === k); if (!x || x.ok) return;

/* ---------- actions ---------- */
document.addEventListener("input", e => { const k = e.target.dataset?.d; if (k !== undefined) S.drafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; });
document.addEventListener("change", e => { const k = e.target.dataset?.d; if (k !== undefined) S.drafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled) return;
  e.preventDefault(); audioOn();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  act(t.dataset.a, t.dataset).then(() => render(true));
});

async function act(a, ds){
  const db = S.db, v = ds.v, k = ds.k;
  switch (a) {
    case "tab": S.tab = v; S.sheet = null; if (isCoachUI()) { S.fiche = null; watch(null); } window.scrollTo(0,0); break;
    case "week": S.week = Math.max(0, Math.min(WEEKS_AHEAD, S.week + Number(v))); S.day = null; break;
    case "day": S.day = v; break;
    case "book": return book(k);
    case "plan-day": { const h = S.drafts["pa.heure"] || "";
      if (await assignSeance(memberId(), S.cur.seances, S.cur.member, S.day, h, false, null, S.owner)) clearDrafts("pa.");
      return; }
    case "cancel": {
      const seat = seatsOf(S.slots[k]).find(x => x.by === memberId()); if (!seat) return;

      if (await run(db.doc("slots/" + seat.doc).delete(), "Réservation annulée")) await unlinkSlot(memberId(), S.cur.seances, k); return; }
    case "block": await run(db.doc("slots/" + k).set({blocked:true, at:Date.now()}), "Créneau bloqué"); return;
    case "unblock": await run(db.doc("slots/" + k).delete(), "Créneau débloqué"); return;
    case "free": { const by = Object.values(S.slots).flatMap(seatsOf).find(x => x.doc === ds.doc)?.by, kk = ds.doc.split("~")[0];
      if (await run(db.doc("slots/" + ds.doc).delete(), "Place libérée") && by) await unlinkSlot(by, S.team[by], kk); return; }
    case "bookfor": S.sheet = {type:"bookfor", k}; return;
    case "renew": { if (!S.confirmRenew) { S.confirmRenew = true; setTimeout(() => { S.confirmRenew = false; render(true); }, 5000); return; } S.confirmRenew = false;
      const e = aboEtat(S.cur.member), fin = addMonth(e.fin && !e.expire ? e.a.fin : iso(new Date(Date.now() - 864e5)));
      await run(db.doc("members/" + S.fiche).update({"abo.fin": fin}), `Renouvelé jusqu'au ${finAbo(parseIso(fin))}`); return; }
    case "project": return project(v, k);
    case "proj-close": closeProj(); return;
    case "board-open": await openBoard(); return;
    case "board-go": boardGo(); return;
    case "repos-plus": if (S.repos) { S.repos.fin += 15000; S.repos.dur = (S.repos.dur || 60000) + 15000; S.repos.at = Date.now(); S.repos.bip = 99; reposPartage(); tickRepos(); } return;

    case "pickfor": { const ok = await claim(k, v); if (ok) { S.sheet = null; toast(`${S.members[v]?.prenom || "Adhérent"} placé·e ${fmtSlot(k)}`); const t = slotDate(k);
      setTimeout(() => assignSeance(v, S.team[v], S.members[v], k.split("_")[0], `${pad(t.getHours())}:${pad(t.getMinutes())}`, true, k, true), 1500); } return; }

    case "back": S.fiche = null; watch(null); return;
    case "preview": S.asMember = S.fiche; S.tab = "seances"; window.scrollTo(0,0); return;
    case "exit-preview": S.fiche = S.asMember; S.asMember = null; S.tab = "adherents"; S.sheet = null; return;
    case "open-seance": S.sheet = {type:"seance", sid:v}; S.edit = false; S.confirmDel = null; return;
    case "close": S.sheet = null; S.edit = false; return;
    case "go": { const s = S.cur.seances[v]; if (!s) return; const st = etapes(s);
      S.go = {sid: v, vu: s.focus, i: st.every(x => x.ok) ? 0 : st.findIndex(x => !x.ok)}; return; }
    case "go-close": if (S.chrono?.own && !S.ecran) stopChrono(); S.go = null; return;

      const j = Math.max(0, Math.min(st.length - 1, st.indexOf(x) + Number(v))); if (S.chrono?.k === x.k) stopChrono(); if (S.go?.sid === E.sid) S.go.i = j; focusSur(E.sid, st[j].k); return; }

      try { await navigator.clipboard.writeText(v2); toast("Lien copié"); } catch (e) { const i = $("lk"); if (i) { i.focus(); i.select(); } toast("Sélectionne le lien et copie-le"); } return; }

      if (!tm) { toast("Indique une heure."); return; }
      const key = `${S.day}_${pad(tm[1])}${tm[2] === "00" ? "" : tm[2]}`;
      if (slotDate(key) < new Date()) { toast("Cette heure est déjà passée."); return; }
      if (await claim(key, v)) { S.sheet = null; toast(`${S.members[v]?.prenom || "Adhérent"} : ${fmtSlot(key)}`); } return; }
    case "plan": { const pk = "pl." + v + ".", sv = S.cur.seances[v] || {};
      const date = S.drafts[pk+"date"] ?? sv.date ?? "", heure = S.drafts[pk+"heure"] ?? sv.heure ?? "";
      if (!date) { toast("Choisis un jour."); return; }
      if (await run(db.doc(`members/${memberId()}/seances/${v}`).update({date, heure}), `Programmée : ${fmtDay(parseIso(date))}${heureLbl(heure)}`)) clearDrafts(pk);
      return; }
    case "prep-auto": S.sheet = {type:"seance", sid:v}; S.edit = true; S.confirmDel = null; return;
    case "visible": await run(db.doc(`members/${memberId()}/seances/${v}`).update({visible: k === "1"}), k === "1" ? `Séance débloquée pour ${S.cur.member?.prenom || "l'adhérent"}` : "Séance cachée"); return;
    case "coche": case "rond": { const s = S.cur.seances[v]; if (!s) return;

      const on = a === "rond" ? !rondOn(s, bi, Number(k.split("-")[1]), Number(k.split("-t")[1])) : !(s.coches || {})[k];
      const apres = {...s, coches: {...(s.coches || {}), [k]: on}}, args = [new firebase.firestore.FieldPath("coches", k), on];
      if (a === "rond") { /* on fige les anciens tours en coches explicites, puis on recalcule le compteur du bloc */
        (b.exos || []).forEach((_, ei) => { for (let t = 1; t <= nbTours(b.tours); t++) { const kk = `${bi}-${ei}-t${t}`; if (kk !== k && (s.coches || {})[kk] === undefined && rondOn(s, bi, ei, t)) { apres.coches[kk] = true; args.push(new firebase.firestore.FieldPath("coches", kk), true); } } });
        const avant = toursComplets(s, bi, b), fait = toursComplets(apres, bi, b);
        apres.toursFaits = {...(s.toursFaits || {}), [bi]: fait}; args.push(new firebase.firestore.FieldPath("toursFaits", String(bi)), fait);
        if (on && fait > avant) { if (seanceFinie(apres)) { stopRepos(); finSeance(); } else { startRepos(b, v); if (fait >= nbTours(b.tours)) bravoBloc(b); } }
      } else if (on && blocFini(apres, bi, b)) { if (seanceFinie(apres)) finSeance(); else bravoBloc(b); }
      /* on ne touche que ces cases : les autres coches restent */
      await run(db.doc(`members/${memberId()}/seances/${v}`).update(...args)); return; }

    case "del-seance": if (S.confirmDel !== v) { S.confirmDel = v; return; }

      texte: "Je suis intéressé·e par les séances coachées en salle. Tu peux me dire comment ça marche ?"}), "Demande envoyée à Nathanael"); return;

async function claim(k, mid){
  const s = S.slots[k]; toast("Réservation en cours…");
  if (s?.blocked) { toast("Ce créneau est indisponible."); return false; }
  if (hasBy(s, mid)) { toast("Déjà inscrit·e sur ce créneau."); return false; }
  /* place 1 puis place 2 : les règles n'autorisent que la création, donc si quelqu'un prend la place entre-temps l'écriture est refusée */
  for (const id of [k, k + "~2"]) {
    const ref = S.db.doc("slots/" + id);
    try { if ((await ref.get()).exists) continue; } catch (e) {}
    return run(ref.set({by: mid, at: Date.now()}));
  }
  toast(`Ce créneau est complet (${CAPACITY} personnes maximum).`); return false;
}
/* forfait à distance / en autonomie : pas de réservation des créneaux coachés (le coach peut toujours placer quelqu'un) */
const sansCoaching = () => (!S.owner || S.asMember) && optionOf(S.cur.member, S.cur.seances) === "distance";
async function book(k){
  if (slotDate(k) < new Date()) return;

  const e = aboEtat(S.cur.member);
  if (e.fin && slotDate(k) >= new Date(e.fin.getFullYear(), e.fin.getMonth(), e.fin.getDate() + 1)) {
    toast(e.expire ? "Ton mois est terminé : vois avec Nathanael pour continuer." : `Ton mois se termine le ${finAbo(e.fin)} : renouvelle-le avec Nathanael pour réserver après.`); return; }

    setTimeout(() => assignSeance(memberId(), S.cur.seances, S.cur.member, k.split("_")[0], `${pad(t.getHours())}:${pad(t.getMinutes())}`, true, k, S.owner), 1500); }
}

/* --- projection fond noir --- */
/* repos d'un bloc en secondes : « repos 1 min 30 », « r1'45 », « récup 45 sec » */
function reposSec(t){ t = String(t || "");
  let m = t.match(/(?:repos|récup|\br)\s*:?\s*(\d+)(?:\s*(?:à|-)\s*\d+)?\s*(?:min|')\s*(\d+)?/i); if (m) return Number(m[1]) * 60 + Number(m[2] || 0);
  m = t.match(/(?:repos|récup|\br)\s*:?\s*(\d+)\s*(?:sec|s\b|")/i); return m ? Number(m[1]) : 0; }
const reposCourt = r => r ? (r >= 60 ? `r${Math.floor(r/60)}'${r % 60 ? pad(r % 60) : ""}` : `r${r}"`) : "";
function tCourt(t){ t = String(t || "");
  const n = t.match(/(\d+)(?:\s*(?:-|à)\s*(\d+))?\s*(tours?|séries?|T\b|S\b)/i), rep = reposCourt(reposSec(t));
  if (n) return `(${n[1]}${n[2] ? "-" + n[2] : ""}${/^s/i.test(n[3]) ? "S" : "T"})${rep ? " " + rep : ""}`;
  return rep; }
/* dose au format du tableau : « @30kg 3x8/c », « 20"/c », « x8-10 » */
function dCourt(d){ let t = String(d || "").trim(); if (!t) return "";
  let kg = ""; t = t.replace(/[·,]?\s*(\+?\d+(?:[.,]\d+)?)\s*kg\b/i, (_, k) => { kg = "@" + k + "kg"; return ""; });
  t = t.replace(/×/g, "x").replace(/\s*\/\s*(côté|jambe|bras|cuisse)(?![a-zà-ÿ])/gi, "/c").replace(/\bpar (côté|jambe|bras)(?![a-zà-ÿ])/gi, "/c")
    .replace(/(\d+)\s*min\s*(\d+)/gi, "$1'$2").replace(/(\d+)\s*min\b/gi, "$1'").replace(/(\d+)\s*(?:sec|s)\b/gi, '$1"')
    .replace(/(\d)\s*x\s*(\d)/g, "$1x$2").replace(/\bx\s+(\d)/g, "x$1").replace(/(\d)\s*à\s*(\d)/g, "$1-$2")
    .replace(/\s*·\s*/g, " ").replace(/\s{2,}/g, " ").replace(/^[\s,]+|[\s,]+$/g, "").replace(/^(\d+(?:-\d+)?)\s*(reps?|répétitions?)?$/i, "x$1");
  return [kg, t].filter(Boolean).join(" "); }
function projLines(s){
  return (s.blocs||[]).filter(b => (b.exos||[]).length).map(b => {
    const fin = /^fin/i.test(b.code), tc = tCourt(b.tours);
    return `<div><b>${fin ? "Finisher" : esc(b.code)}${tc ? " " + esc(tc) : ""} :</b> ${b.exos.map(e => esc(e.n) + (e.d ? " " + esc(dCourt(e.d)) : "")).join(" / ")}</div>`; }).join("");
}
/* la séance à afficher pour ce jour : celle datée du jour, sinon la prochaine pas faite */
function choisirSeance(list, day, salleSeule){
  const all = list.filter(x => (x.blocs||[]).length).sort((a,b) => a.num - b.num), salle = all.filter(x => x.lieu === "Salle");
  return salle.find(x => x.date === day) || all.find(x => x.date === day && x.lieu !== "En autonomie") || salle.find(x => x.statut !== "faite")
    || (salleSeule ? salle[salle.length-1] : all.find(x => x.statut !== "faite" && x.lieu !== "En autonomie") || all.find(x => x.statut !== "faite")) || null;
}

function projBox(x){

function audioOn(){ try { S.ac = S.ac || new (window.AudioContext || window.webkitAudioContext)(); if (S.ac.state !== "running") S.ac.resume(); } catch (e) {} }
function ton(f, t0, dur, vol = .3, type = "sine", f2){ const ac = S.ac; if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .05); }
const bip = (fort) => { try { fort ? (ton(1320, 0, .7, .45, "square"), navigator.vibrate?.([400])) : (ton(880, 0, .15, .35, "square"), navigator.vibrate?.(80)); } catch (e) {} };

function fitProj(){ const el = $("proj"); if (el.hidden) return;

  const fits = fs => { el.style.setProperty("--fs", fs + "px"); return [...el.querySelectorAll(".box")].every(b => b.scrollHeight <= b.clientHeight + 1) && el.scrollHeight <= el.clientHeight + 1; };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (fits(mid)) lo = mid; else hi = mid; }
  el.style.setProperty("--fs", lo + "px"); }

/* écrit les séances dans le lot b ; exist = séances actuelles du membre {sid: séance} */
function putSeances(b, mid, arr, exist, keepDone){
  const all = Object.values(exist || {});
  let num = Math.floor(Math.max(0, ...all.map(y => y.num || 0)));
  const str = (x, n) => String(x ?? "").slice(0, n);
  const pris = new Set(all.map(y => y.num));
  const blocs = x => (x.blocs || []).slice(0, 8).map(bl => ({code: str(bl.code, 8), nom: str(bl.nom, 60), tours: str(bl.tours, 80),
    exos: (bl.exos || []).slice(0, 12).map(e => ({n: str(e.n, 120), d: str(e.d, 80), v: /^https:\/\//.test(e.v || "") ? str(e.v, 300) : "", c: str(e.c, 1500)}))}));
  for (let x of arr.slice(0, 30)) {
    /* "id" d'une séance existante (ex. "s05") : on remplace son contenu, en gardant coches, ressenti et statut */
    /* keepDone : une séance déjà faite garde son contenu, la nouvelle est ajoutée à la suite */
    const old = /^s[0-9_]+$/.test(x.id || "") && exist?.[x.id];
    if (old && !(keepDone && old.statut === "faite")) {
      const maj = {titre: str(x.titre || old.titre, 120), lieu: ["Salle","En autonomie","À distance"].includes(x.lieu) ? x.lieu : old.lieu, blocs: blocs(x)};
      if (/^\d{4}-\d{2}-\d{2}$/.test(x.date || "")) maj.date = x.date;
      if (Number(x.semaine)) maj.semaine = Number(x.semaine);
      if (keepDone) { maj.coches = firebase.firestore.FieldValue.delete();
        const n = Number(x.num); if (n > 0 && n !== old.num && !pris.has(n)) { pris.delete(old.num); pris.add(n); maj.num = n; } }
      b.set(S.db.doc(`members/${mid}/seances/${x.id}`), maj, {merge: true}); continue; }
    /* "num" libre (ex. 1.5 entre deux séances, ou 5 si la séance 5 a disparu) : on le garde */
    if (old) x = {...x, num: old.num + 0.25};
    const n = Number(x.num), insere = n > 0 && !pris.has(n);
    const cur = insere ? n : (() => { do num++; while (pris.has(num)); return num; })(), sid = Number.isInteger(cur) ? `s${pad(cur)}` : "s" + String(cur).replace(".", "_");
    pris.add(cur);
    const lieu = ["Salle","En autonomie","À distance"].includes(x.lieu) ? x.lieu : "Salle";
    b.set(S.db.doc(`members/${mid}/seances/${sid}`), {num: cur, titre: str(x.titre || "Séance " + cur, 120), lieu, visible: typeof x.visible === "boolean" ? x.visible : lieu !== "En autonomie", semaine: Number(x.semaine) || null,
      date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : null, heure: "", statut: "prevue", blocs: blocs(x)}); }
}
/* mises à jour préparées par Claude (maj.json sur le site) : appliquées une seule fois, à l'ouverture coach */
async function applyMajs(){
  let majs;
  try { const r = await fetch("maj.json?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) return; majs = (await r.json()).majs || []; } catch (e) { return; }
  if (!majs.length) return;
  let mem = {};
  try { (await S.db.collection("members").get({source: "server"})).docs.forEach(d => mem[d.id] = d.data()); } catch (e) { return; }
  for (const m of majs) {
    const mid = Object.keys(mem).find(k => (mem[k].prenom || "").trim().toLowerCase() === String(m.prenom || "").toLowerCase());
    if (!mid || !m.id || (mem[mid].majs || []).includes(m.id) || !(m.seances || []).length) continue;
    try {
      const q = await S.db.collection(`members/${mid}/seances`).get({source: "server"}), exist = {};
      q.docs.forEach(d => exist[d.id] = d.data());
      const b = S.db.batch(); putSeances(b, mid, m.seances, exist, true);
      b.update(S.db.doc("members/" + mid), {majs: firebase.firestore.FieldValue.arrayUnion(m.id)});
      await b.commit(); toast(m.message || `${m.prenom} : séances mises à jour`);
    } catch (e) {}
  }
}
async function newSeance(){
  const list = seancesSorted(), last = list[list.length-1], num = (last?.num || 0) + 1, id = "s" + pad(num);
  const nb = nextBooking(memberId());
  const auto = !!last && !isAuto(last);
  const doc = {num, titre: auto ? "Séance en autonomie" : `Séance ${num}`, lieu: auto ? "En autonomie" : "Salle", visible: !auto, semaine: null,
    date: auto ? null : nb ? nb.split("_")[0] : null, statut: "prevue",
    blocs: JSON.parse(JSON.stringify(last?.blocs?.length ? last.blocs : DEFAULT_BLOCS))};
  if (await run(S.db.doc(`members/${memberId()}/seances/${id}`).set(doc), `Séance ${num} créée${last ? " (copie de la précédente)" : ""}`)) { S.sheet = {type:"seance", sid:id}; S.edit = true; }
}
async function saveCycle(){
  const c = S.cur.member?.cycle || DEFAULT_CYCLE, p = "cy.";
  const txt = S.drafts[p+"phases"];
  const phases = txt === undefined ? c.phases : txt.split("\n").map(l => l.split("|").map(x => x.trim())).filter(x => x[0]).map(([r,nom,focus]) => {
    const [de,a] = r.split(/[-–]/).map(n => parseInt(n,10)); return {de: de||1, a: a||de||1, nom: nom||"Phase", focus: focus||""}; });
  const cycle = {nom: (S.drafts[p+"nom"] ?? c.nom).trim() || "Cycle", nb: Math.max(1, Math.min(40, parseInt(S.drafts[p+"nb"] ?? c.nb, 10) || 12)),
    debut: S.drafts[p+"debut"] ?? c.debut ?? "", rythme: (S.drafts[p+"rythme"] ?? c.rythme ?? "").trim(), phases};
  if (await run(S.db.doc("members/" + memberId()).update({cycle}), "Cycle enregistré")) { S.sheet = null; clearDrafts(p); }
}
async function saveMember(mid){
  const p = "mb.", prenom = (S.drafts[p+"prenom"] ?? S.cur.member?.prenom ?? "").trim();
  if (!prenom) { toast("Indique un prénom."); return; }
  const objectif = (S.drafts[p+"objectif"] ?? (mid ? S.cur.member?.objectif : "") ?? "").trim();
  const forfait = (S.drafts[p+"forfait"] ?? (mid ? S.cur.member?.forfait : "") ?? "").trim();
  const email = (S.drafts[p+"email"] ?? (mid ? S.cur.member?.email : "") ?? "").trim().slice(0, 120);
  const option = S.drafts[p+"option"] ?? (optionOf(mid ? S.cur.member : {}, mid ? S.cur.seances : null) || "coache");
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("L'adresse e-mail n'est pas valide."); return; }
  const old = (mid ? S.cur.member?.abo : null) || {}, px = S.drafts[p+"prix"] ?? old.prix ?? "";
  const abo = {prix: px === "" || px === null ? null : Math.max(0, Number(px) || 0), fin: S.drafts[p+"fin"] ?? old.fin ?? "", offert: !!(S.drafts[p+"offert"] ?? old.offert)};
  if (mid) { if (await run(S.db.doc("members/" + mid).update({prenom, objectif, forfait, email, abo, option}), "Fiche enregistrée")) { S.sheet = null; clearDrafts(p); } return; }
  const id = "m-" + rid(10), code = rid(22), b = S.db.batch();
  b.set(S.db.doc("members/" + id), {prenom, objectif, forfait, email, abo, option, manual:true, code, createdAt:Date.now(), cycle: {...DEFAULT_CYCLE, debut: iso(new Date())}});
  b.set(S.db.doc("codes/" + code), {cid: id});
  if (await run(b.commit(), `${prenom} ajouté·e`)) {
    S.sheet = null; clearDrafts(p); S.fiche = id; watch(id); }
}
async function linkTo(from){
  const to = S.fiche, db = S.db;
  try {
    const old = (await db.doc("members/" + from).get()).data() || {};
    const cur = S.cur.member || {};
    await db.doc("members/" + to).update({cycle: old.cycle || cur.cycle || null, objectif: cur.objectif || old.objectif || ""});
    for (const col of ["seances","notes"]) {
      const q = await db.collection(`members/${from}/${col}`).get();
      for (const x of q.docs) { await db.doc(`members/${to}/${col}/${x.id}`).set(JSON.parse(JSON.stringify(x.data()))); await db.doc(`members/${from}/${col}/${x.id}`).delete(); }
    }
    for (const s of Object.values(S.slots)) for (const x of seatsOf(s)) if (x.by === from) await db.doc("slots/" + x.doc).update({by: to});
    await db.doc("members/" + from).delete();
    S.sheet = null; toast("Fiches reliées");
  } catch (e) { toast("La liaison n'a pas pu se terminer. Réessaie : rien n'est perdu."); }
}

/* ---------- démarrage ---------- */
const rid = n => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", a = crypto.getRandomValues(new Uint8Array(n)); return Array.from(a, x => c[x % c.length]).join(""); };
const accessLink = code => code ? `${location.origin}${location.pathname}?c=${code}` : "";

async function coachLogin(){
  const auth = firebase.auth(), p = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(p); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") { await auth.signInWithRedirect(p); return; }
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") { S.loginErr = "Connexion impossible : " + (e.message || e.code); render(true); }
  }
}

/* import unique des fiches existantes : le fichier est fourni par le coach (jamais publié), chiffré en AES-GCM avec une clé dérivée du mot de passe */
async function importSeed(){
  const pw = (S.drafts["imp.pw"] || "").trim(); if (!pw) { toast("Colle d'abord le mot de passe."); return; }
  let data;
  try {
    const file = $("impf")?.files?.[0]; if (!file) { toast("Choisis d'abord le fichier d'import."); return; }
    const buf = new Uint8Array(await file.arrayBuffer());
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct)));
  } catch (e) { toast("Mot de passe incorrect."); return; }
  /* une fiche qui existe déjà (même prénom) est complétée au lieu d'être dupliquée */
  const norm = x => String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  const exist = {}; for (const [id, m] of Object.entries(S.members)) exist[norm(m.prenom)] = [id, m];
  const ids = {}, writes = [];
  for (const [old, m] of Object.entries(data.members)) {
    const e = exist[norm(m.prenom)], cid = e ? e[0] : "m-" + rid(10), code = e?.[1].code || rid(22); ids[old] = cid;
    writes.push(["members/" + cid, {...m, code}]); if (!e?.[1].code) writes.push(["codes/" + code, {cid}]);
    if (e) continue; // fiche existante : on met seulement à jour la fiche (formule, abonnement, objectif)
    for (const [sid, x] of Object.entries(data.seances[old] || {})) writes.push([`members/${cid}/seances/${sid}`, x]);
    for (const [nid, x] of Object.entries(data.notes[old] || {})) writes.push([`members/${cid}/notes/${nid}`, x]);
  }
  for (const [k, x] of Object.entries(data.slots || {})) if (!S.slots[k.split("~")[0]]) writes.push(["slots/" + k, {...x, by: ids[x.by] || x.by}]);
  try { for (let i = 0; i < writes.length; i += 400) { const b = S.db.batch(); writes.slice(i, i+400).forEach(([p, v]) => b.set(S.db.doc(p), v, {merge: true})); await b.commit(); } toast("Fiches importées"); clearDrafts("imp."); }
  catch (e) { toast("Import interrompu : " + (e.code || "erreur")); }
}

/* fiche perso du coach : créée une seule fois (si absente) à partir de seed-perso.js */
async function seedPerso(db){
  const sp = window.SEED_PERSO; if (!sp) return;
  try {
    const ref = db.doc("members/" + sp.id); if ((await ref.get()).exists) return;
    const b = db.batch();
    b.set(ref, {...sp.member, createdAt: Date.now()});
    for (const [id, v] of Object.entries(sp.seances)) b.set(db.doc(`members/${sp.id}/seances/${id}`), v);
    await b.commit(); toast("Tes séances haut des pecs sont ajoutées (fiche Nathanael)");
  } catch (e) { toast("Séances perso non ajoutées : " + (e && (e.code || e.message) || "erreur")); }
}
function startData(isCoach, cid){
  const db = S.db;
  db.collection("slots").limit(2000).onSnapshot(q => { const o = {};
    q.docs.forEach(x => { const v = x.data(), e = o[x.id.split("~")[0]] ??= {seats: []};
      if (v.blocked) e.blocked = true; else if (v.by) { e.seats.push({doc: x.id, by: v.by, at: v.at || 0}); e.by = e.by || v.by; } });
    for (const e of Object.values(o)) e.seats.sort((p, q2) => p.at - q2.at);
    S.slots = o; render();
    if (S.owner) { for (const mid of Object.keys(S.team)) syncBookings(mid, S.team[mid], S.members[mid], true); }
    else if (S.cur.member) syncBookings(S.cur.mid, S.cur.seances, S.cur.member, false); }, () => {});
  if (isCoach) {
    S.owner = true; S.tab = "planning"; seedPerso(db);
    const teamSub = {};
    db.collection("members").limit(500).onSnapshot(q => { const o = {}; q.docs.forEach(x => o[x.id] = x.data()); S.members = o; S.membersLoaded = true;
      for (const mid of Object.keys(o)) if (!teamSub[mid]) teamSub[mid] = db.collection(`members/${mid}/seances`).onSnapshot(q2 => { const so = {}; q2.docs.forEach(x => so[x.id] = x.data()); S.team[mid] = so; render(); syncBookings(mid, so, S.members[mid], true); }, () => {});
      render(); if (!S.majsVu) { S.majsVu = true; applyMajs(); } }, () => {});
  } else { S.owner = false; S.uid = cid; S.tab = "reserver"; watch(cid); }
  S.mode = "ready"; render(true);
}

(async function start(){
  render(true);
  if (!window.firebase || !window.FB_CONFIG) { S.mode = "offline"; render(true); return; }
  firebase.initializeApp(window.FB_CONFIG);
  const auth = firebase.auth();
  S.db = firebase.firestore();
  if (location.hostname === "localhost") { auth.useEmulator("http://localhost:9099", {disableWarnings:true}); S.db.useEmulator("localhost", 8080); }
  try { S.db.enablePersistence({synchronizeTabs:true}).catch(() => {}); } catch (e) {}
  const url = new URL(location.href);
  let code = url.searchParams.get("c");
  const ec = url.searchParams.get("ecran"); if (ec) S.ecran = {sid: ec.split("~").pop(), mid: ec.includes("~") ? ec.split("~")[0] : null};
  /* ?coach : l'espace coach, même si un lien d'adhérente a déjà été ouvert sur cet appareil */
  if (url.searchParams.has("coach")) { code = null; try { localStorage.removeItem("nn.code"); } catch (e) {} }
  else try { if (code) localStorage.setItem("nn.code", code); else code = localStorage.getItem("nn.code"); } catch (e) {}
  try { await auth.getRedirectResult(); } catch (e) {}
  let started = false;
  auth.onAuthStateChanged(async u => {
    if (started) return;
    const isCoach = !!u && !u.isAnonymous && (u.email || "").toLowerCase() === String(window.COACH_EMAIL).toLowerCase();
    if (isCoach) { started = true; startData(true);
      if (S.ecran?.mid) { S.fiche = S.ecran.mid; S.tab = "adherents"; watch(S.fiche); }
      /* le coach qui ouvre le lien d'une adhérente : on lui montre l'appli de cette adhérente */
      const cc = url.searchParams.get("c");
      if (cc) { try { const c = await S.db.doc("codes/" + cc).get(); if (c.exists) { S.fiche = c.data().cid; watch(S.fiche); S.asMember = S.fiche; S.tab = "seances"; toast("Tu vois l'appli de ton adhérente (aperçu coach)"); render(true); } } catch (e) {} }
      try { if (cc) localStorage.removeItem("nn.code"); } catch (e) {}
      return; }
    if (u && !u.isAnonymous) { S.mode = "login"; S.loginErr = `${u.email} n'est pas l'adresse du coach.`; await auth.signOut(); render(true); return; }
    if (!code) { S.mode = "login"; render(true); return; }
    try {
      if (!u) { await auth.signInAnonymously(); return; }  /* onAuthStateChanged repasse ici, connecté */
      const c = await S.db.doc("codes/" + code).get();
      if (!c.exists) { S.mode = "badlink"; render(true); return; }
      const cid = c.data().cid;
      await S.db.doc("links/" + u.uid).set({code, cid, at: Date.now()});
      started = true; startData(false, cid);
    } catch (e) { S.mode = e && e.code === "permission-denied" ? "badlink" : /admin-restricted|operation-not-allowed/.test(e && e.code || "") ? "noanon" : "offline"; S.err = e && (e.code || e.message); render(true); }
  });
})();
