<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NN Coaching</title>
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NN Coaching">

<script>
/* l'icône de l'écran d'accueil doit rouvrir le lien perso de l'adhérente (avec ?c=…), sinon elle tombe sur l'accueil */
(function(){ try {
  var c = new URL(location.href).searchParams.get("c"); if (!c) return;
  var base = location.origin + location.pathname, abs = function(f){ return new URL(f, location.href).href; };
  var m = {name:"NN Coaching", short_name:"NN Coaching", start_url: base + "?c=" + encodeURIComponent(c), scope: base, display:"standalone",
    background_color:"#16161d", theme_color:"#16161d", lang:"fr",
    icons:[{src:abs("icon-192.png"), sizes:"192x192", type:"image/png"}, {src:abs("icon-512.png"), sizes:"512x512", type:"image/png"}]};
  document.querySelector('link[rel=manifest]').href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
} catch (e) {} })();
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Orbitron:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout : appli mobile, bandeau noir + filet or en haut, barre d'onglets fixe en bas, colonne unique de 560px max */
:root {
  --bg:#f2f2f0; --surface:#ffffff; --ink:#16161d; --muted:#6b6a73; --line:#e2e1dc;
  --gold:#a8811a; --gold-soft:#f4ecd6; --mag:#c2185b; --mag-soft:#fbe5ee;
  --ok:#2b7656; --ok-soft:#ddf0e6; --warn:#b0501a; --warn-soft:#fbe8da;
  --band:#16161d; --band-fg:#f7f6f2; --band-muted:#b9b7ae;
  --p1:#2f5d8a; --p2:#a8811a; --p3:#c2185b; --p4:#2b7656;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#101014; --surface:#1a1a20; --ink:#f0efea; --muted:#a2a1aa; --line:#2c2c34;
  --gold:#d6b04c; --gold-soft:#342c19; --mag:#ef5f97; --mag-soft:#3b1a28; --ok:#62c497; --ok-soft:#163126; --warn:#ef9c62; --warn-soft:#3a2416;
  --band:#000000; --band-fg:#f0efea; --band-muted:#9a988f;
  --p1:#6f9fd0; --p2:#d6b04c; --p3:#ef5f97; --p4:#62c497; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#101014; --surface:#1a1a20; --ink:#f0efea; --muted:#a2a1aa; --line:#2c2c34;
  --gold:#d6b04c; --gold-soft:#342c19; --mag:#ef5f97; --mag-soft:#3b1a28; --ok:#62c497; --ok-soft:#163126; --warn:#ef9c62; --warn-soft:#3a2416;
  --band:#000000; --band-fg:#f0efea; --band-muted:#9a988f;
  --p1:#6f9fd0; --p2:#d6b04c; --p3:#ef5f97; --p4:#62c497; color-scheme: dark }

*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}

.top{background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--gold)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold);flex:none}
.top h1{font-size:24px;text-transform:uppercase;white-space:nowrap}
.top .sub{font-size:12px;color:var(--band-muted);white-space:nowrap}
.top-in > div:nth-child(2){min-width:0;overflow:hidden}
.role:empty{display:none}
.role{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--band-muted);color:var(--band-muted);border-radius:99px;padding:3px 9px;white-space:nowrap}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:26px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* projection fond noir, comme le tableau de la salle : cases « prénom » + séance */
.proj{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;padding:2.2vh 1.6vw;display:flex;gap:1.4vw;font-family:"Montserrat",var(--sans)}
.proj[hidden]{display:none}
.proj .side{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:clamp(20px,4.4vh,56px);letter-spacing:.04em;text-transform:uppercase;align-self:center;white-space:nowrap}
.proj .wm{position:absolute;left:50%;top:50%;z-index:0;width:min(70vh,50vw);aspect-ratio:1;transform:translate(-50%,-50%);border:clamp(4px,.9vh,10px) solid #b8922a;border-radius:50%;display:grid;place-items:center;color:#b8922a;font-family:var(--display);font-weight:600;font-size:min(30vh,22vw);letter-spacing:-.02em;opacity:.32;pointer-events:none}
.proj .cols{position:relative;flex:1;min-width:0;height:100%;display:grid;gap:2.2vh 1.6vw;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-template-rows:repeat(var(--r),minmax(0,1fr))}
.proj .box{position:relative;z-index:1;border:3px solid #f2f2f2;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:transparent}
.proj .box h3{margin:0;border:3px solid #e8c547;border-width:4px 3px;text-align:center;font-family:"Montserrat",var(--sans);font-weight:800;font-size:clamp(18px,4.2vh,56px);min-height:1.5em;padding:.45vh 1vw;color:#fff;letter-spacing:.01em}
.proj .lines{padding:1.6vh 1.2vw;display:flex;flex-direction:column;gap:1.5vh;font-weight:600;line-height:1.25;font-size:var(--fs)}
.proj .lines b{color:#f2d23c;font-weight:800}
.proj .sub{color:#bbb;font-weight:600;font-size:.8em}
/* minuteur de repos, par-dessus l'appli sans la bloquer */
.repos{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:55;background:#111;color:#fff;border:2px solid var(--gold);border-radius:999px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:700}
.repos[hidden]{display:none}
.repos .t{font-family:var(--display);font-size:30px;min-width:3.2ch;text-align:center;font-variant-numeric:tabular-nums}
.repos .l{font-size:13px;color:#ccc;max-width:9em;line-height:1.2}
.repos button{white-space:nowrap;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:999px;padding:6px 10px;font:inherit;font-size:13px}
#bravo{position:fixed;inset:0;z-index:58;pointer-events:none;display:none;place-items:center;overflow:hidden}
#bravo.on{display:grid;pointer-events:auto}
#bravo .in{background:#111;color:#fff;border:3px solid var(--gold);border-radius:22px;padding:18px 26px;text-align:center;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .35s ease-out}
#bravo .in b{font-family:var(--display);font-size:30px;letter-spacing:.02em}#bravo .in span{font-size:18px;font-weight:700;color:var(--gold)}
#bravo.grand{background:rgba(0,0,0,.55)}#bravo.grand .in{padding:28px 34px}#bravo.grand .in b{font-size:44px}#bravo.grand .in span{font-size:26px}
#bravo i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:tombe linear forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes tombe{to{transform:translateY(110vh) rotate(720deg)}}
.repos.fini{background:var(--gold);color:#111}.repos.fini .l{color:#111}
.proj .x{position:fixed;z-index:2;bottom:10px;right:12px;background:#222;color:#fff;border:1px solid #555;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;opacity:.75}
.banner{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}
.banner.mag{background:var(--mag-soft)}
.banner b{font-weight:700}

/* bande des jours, façon planning de salle */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{flex:1;text-align:center;font-weight:600;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink)}
.day .dn{font-size:13px;color:var(--muted)}
.day .dd{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.day .dm{font-size:12px;color:var(--muted)}
.day .dc{margin-top:3px;font-size:10px;font-weight:600;color:var(--ok);white-space:nowrap}
.day .dc.au{color:var(--muted)}
.day.on{background:var(--gold-soft)}
.day.on .dd,.day.on .dn,.day.on .dm{color:var(--gold)}
.day.past{opacity:.45}

.slot{background:var(--surface);border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);display:flex;flex-direction:column;overflow:hidden;border:1.5px solid transparent}
.slot-in{display:flex;align-items:center;gap:14px;padding:14px 16px}
.slot .t{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.slot .dur{font-size:12px;color:var(--muted)}
.slot .rail{width:3px;align-self:stretch;border-radius:3px;background:var(--gold)}
.slot .what{flex:1;min-width:0}
.slot .what b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .what > span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 16px 12px}
.slot.mine{border-color:var(--ok)}
.slot .foot{background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot.off{opacity:.55}
.slot.blocked .rail{background:var(--muted)}
.slot.taken .rail{background:var(--mag)}

.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:14.5px;background:var(--mag-soft);color:var(--mag);white-space:nowrap}
.btn.solid{background:var(--mag);color:#fff}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:12px}
.btn.link{background:transparent;padding:4px 0;color:var(--mag)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.mag{background:var(--mag-soft);color:var(--mag)}

.card{background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tap{border:0;text-align:left;width:100%}
.card .h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card .h b{font-size:16px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.list{display:flex;flex-direction:column;gap:10px}

/* séances */
.sline{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:13px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:0;width:100%;text-align:left}
.snum{font-family:var(--display);font-weight:700;font-size:20px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);flex:none;font-variant-numeric:tabular-nums}
.sline.done .snum{background:var(--ink);color:var(--bg)}
.sline.next{outline:2px solid var(--gold)}
.sline .m{flex:1;min-width:0}
.sline .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sline .m span{font-size:12.5px;color:var(--muted)}

/* macro-cycle */
.cyc{display:grid;gap:4px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.ph{height:24px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell{border:0;aspect-ratio:1/1.35;max-width:100%;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-family:var(--display);font-weight:700;font-size:min(17px,calc(1em + 3px));color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
.cell small{font-family:var(--body);font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cell.done{background:var(--ink);color:var(--bg)}
.cell.done small{color:var(--band-muted)}
.cell.next{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.alert::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.phases{display:flex;flex-direction:column;gap:8px}
.phase{display:flex;gap:12px;align-items:flex-start}
.phase .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.phase b{font-size:15px}
.phase p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.phase.cur b::after{content:"en cours";margin-left:8px;font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 7px;vertical-align:2px}

/* feuille (séance, formulaires) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.sheet-top .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:10px}
.sheet-top h2{font-size:22px;flex:1;min-width:0;text-transform:uppercase}
.sheet-top .x{background:rgba(255,255,255,.12);border:0;color:var(--band-fg);border-radius:99px;padding:9px 16px;font-size:14px;font-weight:700}
.sheet main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

.bloc{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bloc-h{background:var(--band);color:var(--band-fg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px}
.bloc-h b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.bloc-h span{font-size:12px;color:var(--gold)}
/* nom de l'exercice sur toute la largeur, la dose en dessous */
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ex .tick{grid-row:1 / span 2}
.ex .vid{grid-column:3;grid-row:1 / span 2}
.ex:first-of-type{border-top:0}
.how{padding:0 14px 10px 52px;font-size:13.5px;color:var(--muted)}
.how summary{cursor:pointer;color:var(--mag);font-weight:600;font-size:12.5px}
.how p{margin:6px 0 0;white-space:pre-wrap}
.ex .n{grid-column:2;min-width:0;font-size:14.5px}
.tick{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-weight:700;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ronds{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.ronds span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rond{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:15px;display:grid;place-items:center;padding:0;cursor:pointer}
.rond.next{border-color:var(--gold);color:inherit;box-shadow:0 0 0 3px var(--gold-soft, #f6efd9)}
.rond.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex.multi{grid-template-columns:minmax(0,1fr) auto}.ex.multi .n,.ex.multi .d{grid-column:1}.ex.multi .vid{grid-column:2}.ex.multi .ronds{grid-column:1 / span 2}
.ex.done .n{color:var(--muted);text-decoration:line-through}
.tourbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--gold-soft, #f6efd9);border-bottom:1px solid var(--line);font-size:14px}
.tourbar .lbl{flex:1}
.tourbar .dots{display:flex;gap:5px}.tourbar .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);display:block}.tourbar .dots i.on{background:var(--gold)}
.tourbar.fini{background:var(--ok-soft)}
.exbas{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;padding:0 14px 8px 52px}
.exbas .how{padding:0;flex:none}.exbas .how[open]{flex-basis:100%}
.rem{flex:1;min-width:150px;font-size:13px}.rem summary{color:var(--muted);font-weight:600;cursor:pointer;padding:2px 0}
.rem textarea{width:100%;margin-top:4px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;min-height:0;background:var(--bg)}
.chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 14px 10px 56px;font-size:13px}
.chg label{font-weight:600;color:var(--muted)}
.chg input{width:9.5em;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--bg)}
.ex .d{grid-column:2;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.ex .d:empty{display:none}
.vid{font-size:11px;font-weight:700;letter-spacing:.05em;background:var(--mag);color:#fff;border-radius:6px;padding:4px 8px;text-decoration:none;flex:none}

.note{background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.note.coach{border-left:3px solid var(--gold)}
.note.adh{border-left:3px solid var(--mag)}
.note .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--mag)}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:30px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale button.hot.on{background:var(--warn);border-color:var(--warn);color:#fff}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs-in{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:99px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px}
.tab{border:0;background:transparent;border-radius:99px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--gold-soft);color:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.empty{background:var(--surface);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
/* séance guidée plein écran : un exo à la fois */
body.going{overflow:hidden}
body.going .repos{display:none!important}
#go{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 70% at 50% 0%,#2b2a33 0%,#111116 55%,#08080b 100%);color:#f4f3ee;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
#go[hidden]{display:none}
#go .in{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px}
.go-top{display:flex;align-items:center;gap:12px}
.go-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:20px;display:grid;place-items:center;flex:none}
.go-prog{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.go-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22e3ff,#7df3ff);transition:width .4s}
.go-cnt{font-size:13px;font-weight:700;color:#bdbbb2;font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.go-bloc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.go-bloc .code{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#22e3ff;font-weight:700}
.go-tours{display:flex;gap:8px;align-items:center;justify-content:center}
.go-tours i{width:12px;height:12px;border-radius:50%;border:2px solid #22e3ff}.go-tours i.on{background:#22e3ff}.go-tours i.cur{box-shadow:0 0 0 4px rgba(34,227,255,.35)}
.go-tours span{font-size:13px;font-weight:700;color:#e9e6da;margin-left:4px}
.go-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.go-card h3{font-family:"Montserrat",var(--body);font-weight:800;font-size:clamp(26px,7.5vw,36px);line-height:1.12;letter-spacing:-.01em;overflow-wrap:anywhere}
.go-dose{font-family:var(--display);font-size:clamp(30px,9vw,44px);font-weight:700;color:#7df3ff;line-height:1;font-variant-numeric:tabular-nums}
.go-card .vid{font-size:14px;padding:10px 18px;border-radius:99px}
.go-card details{width:100%;text-align:left;font-size:14.5px;color:#cfccc2}
.go-card summary{text-align:center;color:#7df3ff;font-weight:700;cursor:pointer;list-style:none}
.go-card summary::-webkit-details-marker{display:none}
.go-card details p{margin:10px 0 0;white-space:pre-wrap;line-height:1.5}
.go-card .chg,.go-card .rem{padding:0;justify-content:center;width:100%;color:#cfccc2}
.go-card .chg input,.go-card .rem textarea{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.go-card .chg label,.go-card .rem summary{color:#bdbbb2}
.go-repos{border-radius:28px;padding:18px;text-align:center;background:linear-gradient(160deg,#22e3ff,#7b5cff);color:#111;display:flex;flex-direction:column;align-items:center;gap:6px}
.go-repos span{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.go-repos b{font-family:var(--display);font-size:72px;line-height:.95;font-variant-numeric:tabular-nums}
.go-repos .row{justify-content:center}
.go-repos button{border:0;border-radius:99px;padding:10px 18px;font-weight:700;background:rgba(0,0,0,.18);color:#111}
.go-repos.fini{background:linear-gradient(160deg,#62c497,#2b7656);color:#fff}.go-repos.fini button{color:#fff}
.go-next{font-size:14px;color:#bdbbb2;text-align:center}.go-next b{color:#f4f3ee}
.go-bas{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:22px;padding-top:6px}
.go-nav{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:24px;display:grid;place-items:center}
.go-nav:disabled{opacity:.25}
.go-fait{width:132px;height:132px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#7fe0b0,#2b9a6a 60%,#1f7a52);color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 14px 40px rgba(43,154,106,.45),inset 0 -4px 0 rgba(0,0,0,.15)}
.go-fait b{font-size:44px;line-height:1}
.go-fait.deja{background:rgba(255,255,255,.1);box-shadow:none;color:#bdbbb2}
@media (prefers-reduced-motion: no-preference){ .go-fait{transition:transform .12s} .go-fait:active{transform:scale(.94)} .go-card{animation:pop .25s ease-out} }
.go-fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.go-fin h3{font-family:"Montserrat",var(--body);font-weight:800;font-size:34px}
.go-fin p{margin:0;color:#cfccc2;font-size:16px}
/* accueil : la séance du jour en grand, avec le bouton Commencer */
.hero{border-radius:28px;padding:22px 20px;background:radial-gradient(120% 90% at 50% 0%,#2b2a33 0%,#141419 60%,#0b0b0e 100%);color:#f4f3ee;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 14px 36px rgba(0,0,0,.18)}
.hero .eyebrow{color:#22e3ff;letter-spacing:.14em}
.hero h2{font-family:"Montserrat",var(--body);font-weight:800;font-size:clamp(24px,6.6vw,30px);line-height:1.15;color:#fff;text-transform:none}
.hero .meta{font-size:14px;color:#bdbbb2}
.hero .btn.link{color:#22e3ff;align-self:center}
.hero-l{display:flex;flex-direction:column;gap:10px;text-align:left}
.hero-r{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 12px 12px 14px}
.hero-r .av{width:42px;height:42px;border-radius:50%;background:#22e3ff;color:#111;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.hero-r .m{flex:1;min-width:0}.hero-r .m b{display:block;font-size:15.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-r .m span{font-size:13px;color:#bdbbb2}
.hero-r .go{border:0;border-radius:16px;padding:12px 16px;font-weight:800;font-size:15px;background:linear-gradient(135deg,#ff2bd6,#7b5cff);color:#fff;white-space:nowrap}
.hero-r .go.fait{background:rgba(98,196,151,.18);color:#62c497}
/* gros bouton d'action, centré */
.btn.xl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:12px 16px;border-radius:20px;font-family:var(--display);font-size:clamp(17px,5.2vw,21px);letter-spacing:.04em;white-space:normal;text-transform:uppercase;background:linear-gradient(135deg,#ff2bd6,#7b5cff);color:#fff;box-shadow:0 10px 26px rgba(255,43,214,.35)}
.btn.xl.gold{background:linear-gradient(135deg,#22e3ff,#7b5cff);color:#111;box-shadow:0 10px 26px rgba(34,227,255,.35)}
.btn.xl.light{background:#fff;color:#111;box-shadow:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
@media (prefers-reduced-motion: no-preference){ .slot,.sline,.card{transition:transform .12s} .sline:active,.card.tap:active{transform:scale(.99)} }
/* ===== Thème futuriste (30/10) : nuit, néon cyan et violet, verre ===== */
:root:not(#nn){
  --bg:#05060d; --surface:rgba(20,24,44,.72); --ink:#e9f1ff; --muted:#8a94b4; --line:rgba(120,170,255,.16);
  --gold:#22e3ff; --gold-soft:rgba(34,227,255,.12); --mag:#ff2bd6; --mag-soft:rgba(255,43,214,.14);
  --ok:#2dffb0; --ok-soft:rgba(45,255,176,.12); --warn:#ff8a3d; --warn-soft:rgba(255,138,61,.14);
  --band:rgba(5,6,13,.78); --band-fg:#e9f1ff; --band-muted:#8a94b4;
  --p1:#22e3ff; --p2:#7b5cff; --p3:#ff2bd6; --p4:#2dffb0;
  --display:"Orbitron","Barlow Condensed",system-ui,sans-serif; color-scheme:dark }
html{color-scheme:dark}
body{background:
  radial-gradient(60% 40% at 15% 0%,rgba(123,92,255,.22),transparent 70%),
  radial-gradient(50% 35% at 100% 20%,rgba(34,227,255,.14),transparent 70%),
  linear-gradient(rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,
  #05060d; background-attachment:fixed}
body::before{background:#05060d}
h1,h2,h3{letter-spacing:.04em}
.top{background:rgba(5,6,13,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(34,227,255,.35);box-shadow:0 1px 24px rgba(34,227,255,.15)}
.top h1{font-size:19px;letter-spacing:.12em;background:linear-gradient(90deg,#e9f1ff,#22e3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{border-color:#22e3ff;color:#22e3ff;font-size:15px;box-shadow:0 0 14px rgba(34,227,255,.55),inset 0 0 10px rgba(34,227,255,.3)}
.role{border-color:rgba(34,227,255,.5);color:#22e3ff}
.sec-h h2,.sec > h2{font-size:21px;text-transform:uppercase;letter-spacing:.08em}
.card,.slot,.sline,.bloc,.note,.empty{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.card.tap:active,.sline:active{border-color:rgba(34,227,255,.5)}
.sline.next,.card[style*="border:2px solid"]{border-color:rgba(34,227,255,.6)!important;box-shadow:0 0 0 1px rgba(34,227,255,.25),0 0 24px rgba(34,227,255,.18)}
.snum{background:rgba(34,227,255,.1);color:#22e3ff;font-family:var(--display);font-size:16px}
.sline.done .snum{background:#22e3ff;color:#05060d}
.bloc-h{background:linear-gradient(90deg,rgba(123,92,255,.35),rgba(34,227,255,.12));border-bottom:1px solid var(--line)}
.bloc-h b{font-size:15px;letter-spacing:.08em}
.btn{background:var(--mag-soft);color:#ff7be6}
.btn.solid{background:linear-gradient(135deg,#ff2bd6,#7b5cff);color:#fff;box-shadow:0 6px 20px rgba(255,43,214,.3)}
.btn.ink{background:linear-gradient(135deg,#22e3ff,#7b5cff);color:#05060d;box-shadow:0 6px 20px rgba(34,227,255,.3)}
.btn.ghost{border-color:rgba(120,170,255,.3);color:var(--ink);background:rgba(255,255,255,.03)}
.btn.xl{font-family:var(--display);font-size:clamp(14px,4.3vw,18px);letter-spacing:.12em}
.btn.xl.light{background:rgba(255,255,255,.06);color:#e9f1ff;border:1px solid var(--line)}
.chip{background:rgba(255,255,255,.06);color:var(--muted)}
.day .dd{font-size:18px}
.day.on{background:rgba(34,227,255,.12);box-shadow:inset 0 0 0 1px rgba(34,227,255,.5),0 0 16px rgba(34,227,255,.2)}
.iconbtn{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--ink)}
.slot .t{font-size:20px}
.slot .rail{box-shadow:0 0 10px currentColor}
.tabs{background:linear-gradient(transparent,rgba(5,6,13,.9) 40%)}
.tabs-in{background:rgba(20,24,44,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(34,227,255,.25);box-shadow:0 0 30px rgba(34,227,255,.12)}
.tab.on{background:rgba(34,227,255,.14);color:#22e3ff;box-shadow:inset 0 0 0 1px rgba(34,227,255,.45),0 0 18px rgba(34,227,255,.25)}
.sheet{background:#05060d}
.sheet-top{background:rgba(5,6,13,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(34,227,255,.35)}
.sheet-top h2{font-size:17px;letter-spacing:.12em}
input[type=text],input[type=date],input[type=number],input[type=time],input[type=url],textarea,select{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--ink)}
.tourbar{background:rgba(34,227,255,.07)}
.rond.next{box-shadow:0 0 0 3px rgba(34,227,255,.2),0 0 14px rgba(34,227,255,.35)}
.rond.on,.tick.on{background:#2dffb0;border-color:#2dffb0;color:#05360f;box-shadow:0 0 12px rgba(45,255,176,.5)}
.vid{background:linear-gradient(135deg,#ff2bd6,#7b5cff)}
.scale button{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--ink)}
.scale button.on{background:#22e3ff;color:#05060d;border-color:#22e3ff}
.hero{background:linear-gradient(160deg,rgba(123,92,255,.28),rgba(20,24,44,.85) 45%,rgba(34,227,255,.12));border:1px solid rgba(34,227,255,.35);box-shadow:0 0 40px rgba(34,227,255,.15),inset 0 1px 0 rgba(255,255,255,.08)}
.hero h2{font-family:var(--display);font-size:clamp(18px,5.4vw,24px);letter-spacing:.05em;text-transform:uppercase}
#go{background:radial-gradient(90% 60% at 50% 0%,rgba(123,92,255,.35),transparent 70%),linear-gradient(rgba(120,170,255,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(120,170,255,.05) 1px,transparent 1px) 0 0/28px 28px,#05060d}
.go-card{background:rgba(20,24,44,.7);border-color:rgba(34,227,255,.25);box-shadow:0 0 30px rgba(34,227,255,.1)}
.go-card h3{font-family:var(--display);font-size:clamp(20px,6vw,28px);letter-spacing:.04em;text-transform:uppercase}
.go-dose{font-family:var(--display);text-shadow:0 0 18px rgba(34,227,255,.6)}
.go-repos b{font-family:var(--display);font-size:60px}
.go-repos{color:#05060d}
.go-fait{background:radial-gradient(circle at 35% 30%,#9dfff0,#2dffb0 45%,#0fae78);color:#04281c;box-shadow:0 0 0 6px rgba(45,255,176,.12),0 0 40px rgba(45,255,176,.55)}
.go-fin h3{font-family:var(--display);font-size:26px;letter-spacing:.06em;text-transform:uppercase}
#bravo .in{background:rgba(10,12,24,.92);border-color:#22e3ff;box-shadow:0 0 40px rgba(34,227,255,.45)}
#bravo .in b{font-family:var(--display);font-size:24px}#bravo .in span{color:#22e3ff}
.repos{background:rgba(10,12,24,.92);border-color:#22e3ff;box-shadow:0 0 24px rgba(34,227,255,.35)}
.toast{background:#22e3ff;color:#05060d}
.banner{border:1px solid var(--line)}
/* vidéo dans un carré */
.vbox{width:100%;aspect-ratio:1/1;max-height:46vh;border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(34,227,255,.3);box-shadow:0 0 24px rgba(34,227,255,.15)}
.vbox iframe{width:100%;height:100%;border:0;display:block}
.vrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vrow a,.vrow button{font-size:13.5px;font-weight:700;border-radius:99px;padding:9px 14px;text-decoration:none;border:1px solid rgba(34,227,255,.35);background:rgba(255,255,255,.05);color:#7df3ff}
.vrow .vid{border:0;color:#fff}
.go-top .go-x.ecr{font-size:18px}
.go-panel{position:fixed;inset:0;z-index:52;background:rgba(3,4,10,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.go-panel .in2{width:100%;max-width:420px;background:rgba(20,24,44,.95);border:1px solid rgba(34,227,255,.35);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center;color:#e9f1ff;box-shadow:0 0 40px rgba(34,227,255,.2)}
.go-panel h3{font-family:var(--display);font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.go-panel p{margin:0;font-size:14px;color:#8a94b4}
.go-panel .qr{align-self:center;background:#fff;padding:10px;border-radius:14px;width:200px;height:200px}
.go-panel .qr svg{width:180px;height:180px;display:block}
.go-panel h3{display:flex;align-items:center;justify-content:center;gap:10px;margin:0}
.go-panel .etapes{text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(34,227,255,.2);border-radius:16px;padding:12px 14px;font-size:14px;color:#cfd8f0}
.go-panel .etapes ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.go-panel .autre{text-align:left;font-size:14px}.go-panel .autre summary{color:#7df3ff;font-weight:700;cursor:pointer;text-align:center}.go-panel .autre[open]{display:flex;flex-direction:column;gap:10px}
.go-panel .lien{font-size:12px;word-break:break-all;color:#7df3ff;background:rgba(255,255,255,.05);border-radius:10px;padding:8px}
/* écran séparé (télé, ordi, tablette) qui suit le téléphone en direct */
#ecran{position:fixed;inset:0;z-index:65;color:#e9f1ff;overflow:hidden;background:radial-gradient(70% 55% at 30% 0%,rgba(123,92,255,.22),transparent 70%),linear-gradient(rgba(120,170,255,.04) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(120,170,255,.04) 1px,transparent 1px) 0 0/48px 48px,#04050b;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:3vh 3vw;padding:4vh 4vw}
#ecran[hidden]{display:none}
#ecran .e-top{grid-column:1 / -1;display:flex;align-items:center;gap:2vw}
#ecran .e-nom{font-family:var(--display);font-size:clamp(20px,4.2vh,52px);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 22px rgba(34,227,255,.5)}
#ecran .e-bloc{font-family:var(--display);font-size:clamp(14px,2.6vh,30px);letter-spacing:.14em;color:#22e3ff;text-transform:uppercase}
#ecran .e-pct{margin-left:auto;font-family:var(--display);font-size:clamp(14px,2.6vh,30px);color:#7df3ff}
#ecran .e-main{display:flex;flex-direction:column;justify-content:safe center;gap:2.4vh;min-width:0;min-height:0;overflow:hidden}
#ecran .e-tours{display:flex;gap:1vh;align-items:center}

<script>
/* ---------- version : un téléphone qui garde une ancienne page se met à jour tout seul ---------- */
const BUILD = "2026-10-31d";
async function checkBuild(){
  if (location.hostname === "localhost" || Date.now() - (checkBuild.t || 0) < 60000) return; checkBuild.t = Date.now();
  try { const r = await fetch(location.pathname + "?nocache=" + Date.now(), {cache: "no-store"}); const v = (await r.text()).match(/const BUILD = "([^"]+)"/)?.[1];
    if (v && v !== BUILD && !S.projOn) { const u = new URL(location.href); u.searchParams.set("v", v); location.replace(u.toString()); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkBuild(); });
setTimeout(checkBuild, 3000);
/* ---------- constantes ---------- */
const HOURS = {1:[14,15,16,17,18], 3:[14,15,16,17,18], 5:[14,15,16,17,18], 6:[9,10,11]}; // lun, mer, ven, sam
const WEEKS_AHEAD = 6;
const CANCEL_HOURS = 24;
const CAPACITY = 2; // 2 personnes maximum par créneau dans la salle
const DEFAULT_BLOCS = [
  {code:"A1", nom:"Échauffement", tours:"2 tours", exos:[]},
  {code:"A2", nom:"Activation", tours:"2 tours", exos:[]},
  {code:"B1", nom:"Renfo", tours:"3 tours", exos:[]},
  {code:"B2", nom:"Renfo", tours:"3 tours", exos:[]},
  {code:"FIN", nom:"Finisher", tours:"1 tour", exos:[]}];
const DEFAULT_CYCLE = {nom:"Cycle 1", nb:12, debut:"", rythme:"2 séances / semaine", phases:[
  {de:1,a:4,nom:"Fondations",focus:"Mobilité, activation, apprentissage des mouvements"},
  {de:5,a:8,nom:"Développement",focus:"Renfo, surcharge progressive (un seul levier à la fois)"},
  {de:9,a:12,nom:"Intensification & bilan",focus:"Charges, gestes du quotidien, re-bilan en fin de cycle"}]};

/* ---------- état ---------- */
const S = {
  db:null, user:null, uid:null, owner:false, mode:"loading",
  tab:null, week:0, day:null,
  slots:{}, members:{}, membersLoaded:false, team:{},
  cur:{mid:null, member:undefined, seances:{}, notes:[]},
  fiche:null, asMember:null, sheet:null, edit:false, drafts:{}, writeBlocked:false
};
let unsubs = [];

/* ---------- utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const keyOf = (d,h) => `${iso(d)}_${pad(h)}`;
function slotDate(k){ const [ds,h] = k.split("_"); const [y,m,d] = ds.split("-").map(Number); return new Date(y,m-1,d,Number(h.slice(0,2)),Number(h.slice(2)||0)); }
const hm = t => `${t.getHours()}h${t.getMinutes() ? pad(t.getMinutes()) : ""}`;
const isCustom = k => k.split("_")[1].length === 4;
/* un créneau a 2 places : document `slots/<clé>` (place 1) et `slots/<clé>~2` (place 2) */
const seatsOf = s => (s && s.seats) || [];
const hasBy = (s, mid) => seatsOf(s).some(x => x.by === mid);
/* un rendez-vous à une heure libre (ex. 14h15) rend indisponibles les créneaux fixes qu'il chevauche */
function overlapOf(k){ const t = slotDate(k), day = k.split("_")[0];
  return Object.keys(S.slots).find(c => isCustom(c) && c.startsWith(day + "_") && S.slots[c].by && Math.abs(slotDate(c) - t) < 36e5) || null; }
function dayKeys(x){ const day = iso(x);
  return [...(HOURS[x.getDay()] || []).map(h => keyOf(x,h)), ...Object.keys(S.slots).filter(c => isCustom(c) && c.startsWith(day + "_"))].sort(); }
const heureLbl = h => h ? " · " + h.replace(":", "h") : "";
function parseIso(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
const fmtDay = d => d.toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"});
const fmtLong = d => d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
const fmtSlot = k => `${fmtDay(slotDate(k))} · ${hm(slotDate(k))}`;
const fmtWhen = t => new Date(t).toLocaleString("fr-FR",{day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const initials = s => (s||"?").trim().slice(0,1).toUpperCase();
function d(key, def){ return key in S.drafts ? S.drafts[key] : def; }
function clearDrafts(prefix){ for (const k of Object.keys(S.drafts)) if (k.startsWith(prefix)) delete S.drafts[k]; }

function weekDays(off){
  const n = new Date(); const m = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  m.setDate(m.getDate() - ((m.getDay()+6)%7) + off*7);
  return [0,1,2,3,4,5,6].map(i => { const x = new Date(m); x.setDate(m.getDate()+i); return x; });
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function run(p, ok){
  try { await p; if (ok) toast(ok); return true; }
  catch (e) {
    const c = e && e.code;
    if (c === "permission-denied") toast("Action refusée : créneau déjà pris, ou lien d'accès plus valable.");
    else if (c === "resource-exhausted") toast("Stockage plein : supprime d'anciennes notes.");
    else toast("Pas de connexion pour l'instant, réessaie dans un moment.");
    return false;
  }
}

/* ---------- données ---------- */
const memberId = () => S.asMember || (S.owner ? S.fiche : S.uid);
const isCoachUI = () => S.owner && !S.asMember;
function nextBooking(mid){
  const now = new Date();
  return Object.keys(S.slots).filter(k => hasBy(S.slots[k], mid) && slotDate(k) > now).sort()[0] || null;
}
/* abonnement : abo {prix (€/mois), fin (AAAA-MM-JJ, dernier jour payé ; vide = illimité), offert} */
function aboEtat(m){
  const a = (m && m.abo) || {}, fin = parseIso(a.fin), t = new Date(); t.setHours(0,0,0,0);
  const jours = fin ? Math.round((fin - t) / 864e5) : null;
  return {a, fin, jours, expire: fin ? jours < 0 : false, prix: Number(a.prix) || 0, offert: !!a.offert};
}
const finAbo = fin => fin.toLocaleDateString("fr-FR",{day:"numeric", month:"long"});
function addMonth(isoStr){ const d0 = parseIso(isoStr) || new Date(); const x = new Date(d0.getFullYear(), d0.getMonth()+1, d0.getDate()); return iso(x); }

    cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
    ppl:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.6 3.5 5.4"/></svg>`,
    dumb:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M3.5 9.5v5M18 7v10M20.5 9.5v5M6 12h12"/></svg>`,
    cyc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`};
  let items = [];
  if (S.mode !== "ready") { t.hidden = true; return; }
  if (isCoachUI()) items = [["planning","Planning",ic.cal],["adherents","Adhérents",ic.ppl]];
  else if (S.cur.member) items = [["reserver","Planning",ic.cal],["seances","Mes séances",ic.dumb],["cycle","Mon cycle",ic.cyc]];

  t.innerHTML = `<div class="tabs-in">${items.map(([k,l,i]) => `<button class="tab ${S.tab===k?"on":""}" data-a="tab" data-v="${k}">${i}${l}</button>`).join("")}</div>`;
}

/* --- planning --- */
function planning(coach){
  const days = weekDays(S.week), today = iso(new Date()), now = new Date();
  if (!S.day || !days.some(x => iso(x) === S.day)) S.day = iso(days.find(x => iso(x) >= today) || days[0]);
  const lbl = S.week === 0 ? "Cette semaine" : S.week === 1 ? "Semaine prochaine" : `Semaine du ${days[0].toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`;
  const dayBtns = days.map(x => {
    const ks = dayKeys(x);
    const free = ks.filter(k => { const s = S.slots[k]; return !isCustom(k) && slotDate(k) > now && !(s && (s.blocked || seatsOf(s).length >= CAPACITY)) && !overlapOf(k); }).length;
    const booked = ks.reduce((n, k) => n + seatsOf(S.slots[k]).length, 0);
    const coachDay = !!HOURS[x.getDay()], planned = plannedOn(iso(x), coach);
    const info = iso(x) < today ? "" : coach ? (booked + planned.length ? `${booked + planned.length} séance${booked + planned.length > 1 ? "s" : ""}` : "")
      : planned.length || ks.some(k => hasBy(S.slots[k], memberId())) ? "✓ prévu" : coachDay ? (free ? "coach" : "complet") : "auto";
    const auCls = !coach && iso(x) >= today && !coachDay && !planned.length ? "au" : "";
    return `<button class="day ${iso(x)===S.day?"on":""} ${iso(x)<today?"past":""}" data-a="day" data-v="${iso(x)}">
      <span class="dn">${x.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}</span>
      <span class="dd">${x.getDate()}</span><span class="dm">${x.toLocaleDateString("fr-FR",{month:"short"})}</span>
      <span class="dc ${auCls}">${info || "&nbsp;"}</span></button>`;
  }).join("");
  const dd = parseIso(S.day);
  const slots = dayKeys(dd).map(k => slotCard(k, coach)).join("") || `<div class="card"><span class="small muted">${coach ? "Pas de créneau en salle ce jour-là." : "Nathanael n'est pas à la salle ce jour-là : pas de séance coachée."}</span></div>`;
  return `<section class="sec">
    <div class="sec-h"><h2>${coach ? "Mon planning" : "Mon planning"}</h2><span class="eyebrow">lun → dim</span></div>
    <div class="weeknav"><button class="iconbtn" data-a="week" data-v="-1" ${S.week<=0?"disabled":""} aria-label="Semaine précédente">‹</button>
      <span class="lbl">${lbl}</span>
      <button class="iconbtn" data-a="week" data-v="1" ${S.week>=WEEKS_AHEAD?"disabled":""} aria-label="Semaine suivante">›</button></div>
    <div class="days">${dayBtns}</div>
    <div class="eyebrow" style="margin-top:4px">${esc(fmtLong(dd))}</div>
    ${HOURS[dd.getDay()] ? `<div class="eyebrow" style="margin-top:2px">${coach ? "Créneaux en salle" : "Avec Nathanael, en salle"}</div>` : ""}
    ${!coach && HOURS[dd.getDay()] && sansCoaching() ? `<p class="small muted" style="margin:0">Ta formule est en autonomie / à distance : les créneaux en salle ne sont pas réservables. Programme ta séance plus bas, à l'heure que tu veux.</p>` : ""}
    <div class="list">${slots}</div>
    ${coach ? teamDay(S.day) : S.day >= today && S.cur.member ? autoCard(S.day) : ""}
    ${coach && S.day >= today ? `<button class="btn ghost" data-a="custom-open">+ Rendez-vous à une autre heure</button>` : ""}
    ${coach ? "" : `<p class="small muted" style="margin:0">Annulation possible jusqu'à ${CANCEL_HOURS} h avant la séance. Après, préviens Nathanael directement.</p>`}
  </section>`;
}

/* séances datées (hors salle avec réservation) d'un jour : la mienne, ou celles de toute l'équipe pour le coach */
function plannedOn(day, coach){
  if (coach) return Object.entries(S.team).flatMap(([mid, o]) => Object.entries(o || {}).filter(([,x]) => x.date === day && !x.slot).map(([id,x]) => ({mid, id, ...x})));
  return allSeances().filter(x => x.date === day && !x.slot && !hiddenFor(x));
}
function autoCard(day){
  const coachDay = !!HOURS[parseIso(day).getDay()], mine = plannedOn(day, false);
  const p = pickSeance(S.cur.seances, S.cur.member, day, false, false);
  const deja = mine.map(x => `<button class="sline" data-a="open-seance" data-v="${x.id}"><span class="snum">✓</span><span class="m"><b>${esc(x.titre || "Séance")}</b><span>${esc(lieuLbl(x))}${esc(heureLbl(x.heure))}</span></span></button>`).join("");
  return `<div class="eyebrow" style="margin-top:6px">${coachDay ? "Sans Nathanael (autre heure)" : "Ce jour-là : en autonomie ou à distance"}</div>
    ${deja ? `<div class="list">${deja}</div>` : ""}
    <div class="card"><b>Séance en autonomie${S.cur.member?.option === "distance" ? " / à distance" : ""}</b>
      ${p.s ? `<span class="small">Ta séance ce jour-là : <b>${esc(p.s.titre || "Séance")}</b>${isAuto(p.s) ? "" : " (faite seule, sans Nathanael)"}</span>` : `<span class="small muted">${esc(p.why)}</span>`}
      ${p.s && p.why ? `<span class="small muted">${esc(p.why)}</span>` : ""}
      ${p.s ? `<div class="grid3"><label class="f" style="grid-column:span 2">Heure<input type="time" id="pa-h" data-d="pa.heure" value="${esc(d("pa.heure",""))}"></label>
      <div style="align-self:end"><button class="btn solid" data-a="plan-day" ${S.writeBlocked?"disabled":""}>Programmer</button></div></div>` : ""}
      <span class="small muted">L'ordre du cycle est respecté : renfo et stretching en alternance, jamais deux renfos d'affilée.</span></div>`;
}
function teamDay(day){
  const l = plannedOn(day, true).sort((a,b) => (a.heure||"99").localeCompare(b.heure||"99"));
  if (!l.length) return "";
  return `<div class="eyebrow" style="margin-top:6px">Entraînements prévus ce jour-là (hors créneaux)</div><div class="list">${l.map(x => `<button class="sline" data-a="open-member" data-v="${esc(x.mid)}">
    <span class="snum">${esc(initials(S.members[x.mid]?.prenom))}</span><span class="m"><b>${esc(S.members[x.mid]?.prenom || "Adhérent")} · ${esc(x.titre || "Séance")}</b>
    <span>${esc(lieuLbl(x))}${esc(heureLbl(x.heure))}${x.statut === "faite" ? " · faite" : ""}</span></span></button>`).join("")}</div>`;
}
function slotCard(k, coach){
  const s = S.slots[k] || {}, seats = seatsOf(s), n = seats.length, full = n >= CAPACITY;
  const t = slotDate(k), past = t < new Date(), me = memberId();
  const h = `${pad(t.getHours())}:${pad(t.getMinutes())}`, ov = !n && !s.blocked ? overlapOf(k) : null;
  const jauge = `<span class="chip ${full ? "" : n ? "gold" : "ok"}" style="padding:1px 8px;margin-right:6px;font-size:12px">${n}/${CAPACITY}</span>`;
  let cls = "", right = "", foot = "", who = "À la salle";
  if (ov) { cls = "blocked off"; who = coach ? `Pris par le rdv de ${hm(slotDate(ov))}` : "Indisponible"; }
  else if (coach) {
    if (s.blocked) { cls = "blocked"; who = "Créneau bloqué"; right = past ? "" : `<button class="btn sm ghost" data-a="unblock" data-k="${k}">Débloquer</button>`; }
    else {
      if (full) cls = "taken";
      who = n ? `${jauge} ` + seats.map(x => { const m = S.members[x.by]; return m ? `<b style="display:inline;font-size:inherit;color:var(--ink)">${esc(m.prenom)}</b>` : "Adhérent"; }).join(" + ")
              : `${jauge} ${past ? "Libre" : "À la salle"}`;
      right = seats.map(x => { const m = S.members[x.by];
        return `${m ? `<button class="btn sm" data-a="open-member" data-v="${esc(x.by)}">Fiche ${esc(m.prenom)}</button>` : ""}${past ? "" : `<button class="btn sm ghost" data-a="free" data-doc="${esc(x.doc)}">Libérer${m ? " " + esc(m.prenom) : ""}</button>`}`; }).join("");
      if (n) right += `<button class="btn sm ink" data-a="project" data-v="slot" data-k="${k}">▶ Projeter</button>`;
      if (!past && !full) right += `<button class="btn sm solid" data-a="bookfor" data-k="${k}">+ Placer</button>` + (n ? "" : `<button class="btn sm ghost" data-a="block" data-k="${k}">Bloquer</button>`);
      if (right) right = `<div class="row">${right}</div>`;
    }
  } else {
    if (!s.blocked) who = `${jauge} ${n === 0 ? "Personne pour l'instant" : n === 1 ? "1 personne inscrite" : "Complet"}`;
    if (hasBy(s, me)) { cls = "mine"; const canCancel = (t - new Date()) / 36e5 > CANCEL_HOURS;
      who = `${jauge} ${n === 1 ? "Personne d'autre pour l'instant" : "Une autre personne sera là"}`;
      foot = `<div class="foot"><span>✓ Réservé</span><a class="btn sm link" href="${esc(gcalSlot(k))}" target="_blank" rel="noopener">+ Google Agenda</a>${canCancel ? `<button class="btn sm link" data-a="cancel" data-k="${k}">Annuler</button>` : `<span class="small">${past ? "" : "moins de 24 h"}</span>`}</div>`; }
    else if (full || s.blocked) { cls = "taken"; right = `<span class="chip">${s.blocked ? "Indisponible" : "Complet"}</span>`; }
    else if (!past && sansCoaching()) { cls = "taken"; right = `<span class="chip">Formule coachée</span>`; }
    else if (!past) right = `<button class="btn sm" data-a="book" data-k="${k}" ${S.writeBlocked?"disabled":""}>+ Réserver</button>`;
  }
  if (past && !foot && !n) cls += " off";
  const tap = !coach && right.includes('data-a="book"') ? ` data-a="book" data-k="${k}" role="button" style="cursor:pointer"` : "";
  return `<div class="slot ${cls}"${tap}><div class="slot-in">
    <div><div class="t">${h}</div><div class="dur">60 min</div></div><div class="rail"></div>
    <div class="what"><b>${coach ? "Coaching privé" : "Coaching"}</b><span>${who}</span></div>${coach ? "" : right}</div>${coach && right ? `<div class="acts">${right}</div>` : ""}${foot}</div>`;
}

function mesRdv(){
  const mid = memberId(), now = new Date();
  const ks = Object.keys(S.slots).filter(k => hasBy(S.slots[k], mid) && slotDate(k) > now).sort();
  const today = iso(now);
  const auto = allSeances().filter(x => isAuto(x) && !hiddenFor(x) && x.statut !== "faite" && x.date && x.date >= today);
  if (!ks.length && !auto.length) return "";
  return `<section class="sec"><div class="eyebrow">Tes prochains rendez-vous</div>
    <div class="row">${ks.map(k => { const x = allSeances().find(y => y.slot === k); return `<span class="chip ok">✓ ${esc(fmtSlot(k))} · avec Nathanael${x ? " · " + esc(x.titre || "") : ""}</span>`; }).join("")}
    ${auto.map(x => `<button class="chip gold" style="border:0" data-a="open-seance" data-v="${x.id}">${esc(x.titre || "Séance en autonomie")} · ${esc(fmtDay(parseIso(x.date)))}${esc(heureLbl(x.heure))}</button>`).join("")}</div></section>`;
}

/* --- adhérents (coach) --- */

      <div class="card"><b>Reprendre Flo, Mélanie et Audrey</b><span class="small muted">Choisis le fichier d'import que Claude t'a envoyé, puis colle le mot de passe.</span>

      <details class="card"><summary class="small">Mettre à jour depuis un fichier d'import</summary><span class="small muted">Les fiches existantes (même prénom) sont complétées, sans doublon. Coches, ressentis et notes sont gardés.</span>
      <input type="file" id="impf" accept=".enc,application/octet-stream">
      <input type="text" id="imp" data-d="imp.pw" autocomplete="off" placeholder="Mot de passe" value="${esc(d("imp.pw",""))}"><button class="btn solid" data-a="import">Importer</button></details>`}
    <p class="small muted" style="margin:0">Les fiches, séances et notes de chaque adhérent ne sont visibles que par toi et par lui. Les autres adhérents voient seulement si un créneau est pris.</p>
    <button class="btn ghost" data-a="logout">Se déconnecter</button></section>`;
}

  if (m === undefined) return `<div class="empty">Chargement…</div>`;
  if (m === null) return `<div class="empty">Cette fiche n'existe plus. <button class="btn sm" data-a="back">Retour</button></div>`;
  const nb = nextBooking(S.fiche), list = seancesSorted();
  const recent = S.cur.notes.filter(n => n.auteur === "adherent").slice(-3).reverse();
  return `<div class="row"><button class="btn sm ghost" data-a="back">‹ Adhérents</button></div>
  <section class="sec"><div class="h row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(m.prenom))}</span>

    <div class="row">${nb ? `<span class="chip ok">Prochain rdv : ${esc(fmtSlot(nb))}</span>` : `<span class="chip">Aucun rdv à venir</span>`}
      <span class="chip ${m.manual ? "" : "ok"}">${m.manual ? "Fiche coach" : "Compte relié"}</span>
      ${(o => o ? `<span class="chip ${o === "coache" ? "gold" : ""}">${o === "coache" ? "Séances coachées" : "À distance"}</span>` : "")(optionOf(m, S.cur.seances))}</div>
    <div class="row"><button class="btn sm" data-a="preview">Voir son appli</button><button class="btn sm ghost" data-a="edit-member">Modifier la fiche</button>
</div></section>
  <section class="sec"><div class="card"><b>Son lien d'accès</b>
    ${m.code ? `<span class="small muted">À envoyer par texto. Elle l'ouvre et l'ajoute à son écran d'accueil, sans compte ni mot de passe.</span>
      <input type="text" id="lk" readonly value="${esc(accessLink(m.code))}" onclick="this.select()">
      <div class="row"><button class="btn sm solid" data-a="copy-link">Copier le lien</button><button class="btn sm ghost" data-a="new-code">${S.confirmCode ? "Confirmer : l'ancien lien ne marchera plus" : "Nouveau lien"}</button></div>`
    : `<span class="small muted">Pas encore de lien pour cette fiche.</span><div class="row"><button class="btn sm solid" data-a="new-code">Créer son lien</button></div>`}</div></section>
  <section class="sec">${aboCard(m, true)}</section>
  ${recent.length ? `<section class="sec"><div class="eyebrow">Derniers messages de ${esc(m.prenom)}</div>${recent.map(noteHtml).join("")}</section>` : ""}

  `;
}

/* --- espace adhérent --- */
function onboarding(){
  return `<section class="sec"><h2>Bienvenue !</h2>
    <p style="margin:0">Crée ton espace pour réserver tes séances avec Nathanael et suivre ton programme. Seuls toi et ton coach voient ton suivi.</p>
    <label class="f">Ton prénom<input type="text" id="ob-p" data-d="ob.prenom" value="${esc(d("ob.prenom",""))}" autocomplete="given-name"></label>
    <label class="f">Ton objectif, en une phrase<textarea id="ob-o" data-d="ob.objectif">${esc(d("ob.objectif",""))}</textarea></label>
    <button class="btn solid" data-a="register">Créer mon espace</button>
    ${S.writeBlocked ? `<div class="banner warn">Ton accès à l'appli est en lecture seule. Demande à Nathanael de t'ajouter avec le droit de modifier.</div>` : ""}</section>`;
}

function seancesView(){
  const list = seancesSorted(), nx = nextSeance(list), m = S.cur.member, nxAll = nextSeance(allSeances());
  const waiting = nxAll && hiddenFor(nxAll) ? `<div class="card" style="border:2px dashed var(--line)"><span class="eyebrow">Séance ${nxAll.num} · en autonomie</span>
    <span>Elle sera disponible ici après ta séance avec Nathanael : vous faites le point ensemble, puis il l'ajuste pour toi.</span></div>` : "";
  if (!list.length && waiting) return `<section class="sec"><h2>Mes séances</h2>${waiting}</section>`;
  if (!list.length) return `<section class="sec"><h2>Mes séances</h2><div class="empty">Nathanael prépare ton programme. Tes séances apparaîtront ici.</div></section>`;
  return `<section class="sec"><h2>Mes séances</h2>${waiting}
    ${nx && !waiting ? `<button class="card tap" data-a="open-seance" data-v="${nx.id}" style="border:2px solid var(--gold)">
      <span class="eyebrow">Prochaine séance</span><div class="h"><b style="font-family:var(--display);font-size:24px">S${nx.num} · ${esc(nx.titre||"")}</b></div>
      <span class="small muted">${esc(lieuLbl(nx))}${nx.date ? " · " + esc(fmtDay(parseIso(nx.date)) + heureLbl(nx.heure)) : ` · semaine ${nx.semaine||""}`}</span>

}

function sline(s, nx, m){
  const pi = phaseOf(m?.cycle, s.num);
  return `<button class="sline ${s.statut==="faite"?"done":""} ${nx&&nx.id===s.id?"next":""}" data-a="open-seance" data-v="${s.id}">

    <span>${esc(lieuLbl(s))}${s.date ? " · " + esc(fmtDay(parseIso(s.date)) + heureLbl(s.heure)) : s.semaine ? " · sem. " + s.semaine : ""}${pi>=0 ? " · " + esc(m.cycle.phases[pi].nom) : ""}</span></span>
    ${hasAlert(s) ? `<span class="chip warn">À adapter</span>` : s.statut==="faite" ? `<span class="chip ok">Faite</span>` : isCoachUI() && isAuto(s) ? (s.visible ? `<span class="chip mag">Débloquée</span>` : `<span class="chip">Cachée</span>`) : ""}</button>`;
}

/* --- macro-cycle --- */
function cycleView(m, adh){
  const c = m.cycle, list = seancesSorted(), nx = nextSeance(list);
  if (!c) return `<section class="sec"><div class="sec-h"><h2>Macro-cycle</h2>${adh ? "" : `<button class="btn sm solid" data-a="edit-cycle">Créer le cycle</button>`}</div>
    <div class="empty">${adh ? "Ton cycle n'est pas encore prêt." : "Pas encore de cycle pour cet adhérent."}</div>${adh ? "" : seancesBlock(list, nx, m)}</section>`;
  const n = Math.max(1, Number(c.nb) || 12), byNum = {}, locked = {}; list.forEach(s => byNum[s.num] = s);
  allSeances().forEach(s => { if (!byNum[s.num]) locked[s.num] = true; });
  const cols = ["var(--p1)","var(--p2)","var(--p3)","var(--p4)"];
  const curPhase = phaseOf(c, nx ? nx.num : n);
  const bands = (c.phases||[]).map((p,i) => `<div class="ph" style="grid-column:${Math.max(1,p.de)} / ${Math.min(n,p.a)+1};background:${cols[i%4]}" title="${esc(p.nom)}">${esc(p.nom)}</div>`).join("");
  const cells = Array.from({length:n}, (_,i) => { const s = byNum[i+1];
    return `<button class="cell ${s?.statut==="faite"?"done":""} ${nx&&s&&nx.id===s.id?"next":""} ${s&&hasAlert(s)?"alert":""}" ${s ? `data-a="open-seance" data-v="${s.id}"` : "disabled"} aria-label="Séance ${i+1}">
      ${i+1}<small>${s ? (isAuto(s) ? "A" : "S") : locked[i+1] ? "A ·" : ""}</small></button>`; }).join("");
  const done = list.filter(s => s.statut === "faite").length;
  const gen = S.cur.notes.filter(x => !x.seance);
  return `<section class="sec">
    <div class="sec-h"><h2>${adh ? "Mon cycle" : "Macro-cycle"}</h2>${adh ? "" : `<button class="btn sm ghost" data-a="edit-cycle">Modifier</button>`}</div>
    <div class="card"><div class="h"><b>${esc(c.nom)}</b><span class="chip gold">${done} / ${n} faites</span></div>
      <dl class="kv">${m.forfait ? `<dt>Formule</dt><dd>${esc(m.forfait)}</dd>` : ""}<dt>Début</dt><dd>${c.debut ? esc(fmtLong(parseIso(c.debut))) : "à définir"}</dd><dt>Rythme</dt><dd>${esc(c.rythme||"")}</dd></dl>
      <div style="overflow-x:auto"><div class="cyc" style="--n:${n};min-width:${n>16?n*20:0}px;${n>12?"gap:2px;font-size:11px":""}">${bands}${cells}</div></div>
      <div class="legend"><span><i style="background:var(--ink)"></i>faite</span><span><i style="box-shadow:inset 0 0 0 2px var(--gold)"></i>prochaine</span><span><i style="background:var(--warn);border-radius:50%"></i>à adapter</span><span>S salle · A autonomie</span></div>
    </div>
    <div class="phases">${(c.phases||[]).map((p,i) => `<div class="phase ${i===curPhase?"cur":""}"><span class="sw" style="background:${cols[i%4]}"></span>
      <div><b>${esc(p.nom)}</b> <span class="small muted">S${p.de}–S${p.a}</span><p>${esc(p.focus||"")}</p></div></div>`).join("")}</div>
  </section>
  ${adh ? "" : seancesBlock(list, nx, m)}
  <section class="sec"><div class="eyebrow">Notes sur le cycle</div>
    ${gen.length ? gen.map(noteHtml).join("") : `<p class="small muted" style="margin:0">${adh ? "Une douleur, une contrainte d'agenda, un objectif qui change ? Écris-le ici, Nathanael adaptera ton cycle." : "Notes générales (objectifs, contraintes, ajustements du cycle)."}</p>`}
    ${noteForm("")}</section>`;
}
function suiteBlock(list, m){
  const reste = list.filter(x => x.statut !== "faite").length, k = "su.";
  return `<section class="sec"><div class="banner ${reste <= 1 ? "warn" : ""}" style="flex-direction:column;align-items:stretch;gap:8px">
    <b>${reste === 0 ? "Toutes les séances programmées sont faites : prépare la suite." : reste === 1 ? "Plus qu'une séance programmée : prépare la suite." : `Encore ${reste} séances programmées.`}</b>
    <label class="f">Consignes pour les prochaines séances (Claude en tient compte ; si tu ne mets rien, il continue la progression)
      <textarea id="su-c" data-d="${k}consignes" placeholder="Ex. genou mieux, on peut charger ; moins de gainage ; ajouter du haut du corps…">${esc(d(k+"consignes", m.consignes || ""))}</textarea></label>
    <div class="row"><button class="btn sm solid" data-a="save-consignes">Enregistrer les consignes</button></div>
    <details><summary class="small">Ajouter des séances préparées par Claude</summary>
      <span class="small muted">Choisis le fichier .json envoyé par Claude, ou colle le bloc de texte.</span>
      <input type="file" id="su-f" accept=".json,application/json,text/plain">
      <textarea id="su-p" data-d="${k}paste" placeholder="Colle ici le bloc de séances" style="min-height:90px;font-family:ui-monospace,monospace;font-size:12px">${esc(d(k+"paste",""))}</textarea>
      <div class="row"><button class="btn sm solid" data-a="paste-seances">Ajouter ces séances</button></div></details></div></section>`;

function seancesBlock(list, nx, m){
  return suiteBlock(list, m) + `<section class="sec"><div class="sec-h"><h2>Séances</h2><button class="btn sm solid" data-a="new-seance">+ Nouvelle</button></div>
    ${list.length ? `<div class="list">${list.map(s => sline(s, nx, m)).join("")}</div>` : `<div class="empty">Aucune séance. « Nouvelle » crée la séance 1 au format A1 / A2 / B1 / B2 / FIN.</div>`}</section>`;

/* --- notes --- */
function noteHtml(n){
  const coach = n.auteur === "coach", who = coach ? "Coach" : (S.cur.member?.prenom || "Adhérent");
  const mine = isCoachUI() || S.owner || n.auteur === "adherent";
  return `<div class="note ${coach?"coach":"adh"}"><div class="meta"><b style="color:var(--ink)">${esc(who)}</b><span>${esc(fmtWhen(n.at))}</span>
    ${n.suivante ? `<span class="chip gold">pour la séance suivante</span>` : ""}${n.option ? `<span class="chip mag">veut des séances coachées</span>` : ""}
    ${mine ? `<button class="btn link sm" style="margin-left:auto;font-size:12px;color:var(--muted)" data-a="del-note" data-v="${esc(n.id)}">Supprimer</button>` : ""}</div>
    <div class="txt">${esc(n.texte)}</div></div>`;
}
function noteForm(sid){
  const k = "note." + (sid || "cycle");
  return `<div class="card"><label class="f">${isCoachUI() || S.owner ? "Ta note de coach" : "Ta note pour Nathanael"}
    <textarea id="nt-${sid||"cycle"}" data-d="${k}.t" placeholder="${sid ? "Ressenti, exercice trop dur ou trop facile, douleur, ce que tu veux changer…" : "Ce qui doit changer dans le cycle…"}">${esc(d(k+".t",""))}</textarea></label>
    ${sid ? `<label class="check"><input type="checkbox" id="nc-${sid}" data-d="${k}.s" ${d(k+".s",true)?"checked":""}> À prendre en compte pour la séance suivante</label>` : ""}
    <div class="row"><button class="btn solid" data-a="send-note" data-v="${sid}" ${S.writeBlocked?"disabled":""}>Envoyer la note</button></div></div>`;
