<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NN Coaching</title>
<meta name="theme-color" content="#16161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NN Coaching">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* l'icône de l'écran d'accueil doit rouvrir le lien perso de l'adhérente (avec ?c=…), sinon elle tombe sur l'accueil */
(function(){ try {
  var c = new URL(location.href).searchParams.get("c"); if (!c) return;
  var base = location.origin + location.pathname, abs = function(f){ return new URL(f, location.href).href; };
  var m = {name:"NN Coaching", short_name:"NN Coaching", start_url: base + "?c=" + encodeURIComponent(c), scope: base, display:"standalone",
    background_color:"#16161d", theme_color:"#16161d", lang:"fr",
    icons:[{src:abs("icon-192.png"), sizes:"192x192", type:"image/png"}, {src:abs("icon-512.png"), sizes:"512x512", type:"image/png"}]};
  document.querySelector('link[rel=manifest]').href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
} catch (e) {} })();
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile, bandeau noir + filet or en haut, barre d'onglets fixe en bas, colonne unique de 560px max */
:root {
  --bg:#f2f2f0; --surface:#ffffff; --ink:#16161d; --muted:#6b6a73; --line:#e2e1dc;
  --gold:#a8811a; --gold-soft:#f4ecd6; --mag:#c2185b; --mag-soft:#fbe5ee;
  --ok:#2b7656; --ok-soft:#ddf0e6; --warn:#b0501a; --warn-soft:#fbe8da;
  --band:#16161d; --band-fg:#f7f6f2; --band-muted:#b9b7ae;
  --p1:#2f5d8a; --p2:#a8811a; --p3:#c2185b; --p4:#2b7656;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#101014; --surface:#1a1a20; --ink:#f0efea; --muted:#a2a1aa; --line:#2c2c34;
  --gold:#d6b04c; --gold-soft:#342c19; --mag:#ef5f97; --mag-soft:#3b1a28; --ok:#62c497; --ok-soft:#163126; --warn:#ef9c62; --warn-soft:#3a2416;
  --band:#000000; --band-fg:#f0efea; --band-muted:#9a988f;
  --p1:#6f9fd0; --p2:#d6b04c; --p3:#ef5f97; --p4:#62c497; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#101014; --surface:#1a1a20; --ink:#f0efea; --muted:#a2a1aa; --line:#2c2c34;
  --gold:#d6b04c; --gold-soft:#342c19; --mag:#ef5f97; --mag-soft:#3b1a28; --ok:#62c497; --ok-soft:#163126; --warn:#ef9c62; --warn-soft:#3a2416;
  --band:#000000; --band-fg:#f0efea; --band-muted:#9a988f;
  --p1:#6f9fd0; --p2:#d6b04c; --p3:#ef5f97; --p4:#62c497; color-scheme: dark }

*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}

.top{background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--gold)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold);flex:none}
.top h1{font-size:24px;text-transform:uppercase;white-space:nowrap}
.top .sub{font-size:12px;color:var(--band-muted);white-space:nowrap}
.top-in > div:nth-child(2){min-width:0;overflow:hidden}
.role:empty{display:none}
.role{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--band-muted);color:var(--band-muted);border-radius:99px;padding:3px 9px;white-space:nowrap}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* projection fond noir (écran de la salle ou télé) */
.proj{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;padding:2vh 1.5vw;display:flex;flex-direction:column;gap:1.5vh}
.proj[hidden]{display:none}
.proj .cols{flex:1;min-height:0;display:grid;gap:1.2vw;grid-template-columns:repeat(var(--c),minmax(0,1fr))}
.proj .box{border:3px solid #f5f5f5;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.proj .box h3{margin:0;border:4px solid #ffd21f;text-align:center;font-family:var(--display);font-size:clamp(28px,4.6vh,64px);padding:.6vh 1vw;color:#fff;letter-spacing:.02em}
.proj .lines{padding:1.6vh 1.4vw;display:flex;flex-direction:column;gap:1.6vh;font-weight:700;line-height:1.3;font-size:var(--fs)}
.proj .lines b{color:#ffd21f}
.proj .sub{color:#bbb;font-weight:600;font-size:.8em}
.proj .x{position:fixed;bottom:10px;right:12px;background:#222;color:#fff;border:1px solid #555;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;opacity:.75}
.banner{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}
.banner.mag{background:var(--mag-soft)}
.banner b{font-weight:700}

/* bande des jours, façon planning de salle */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{flex:1;text-align:center;font-weight:600;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border:0;background:transparent;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink)}
.day .dn{font-size:13px;color:var(--muted)}
.day .dd{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05}
.day .dm{font-size:12px;color:var(--muted)}
.day .dc{margin-top:3px;font-size:11px;font-weight:600;color:var(--ok)}
.day.on{background:var(--gold-soft)}
.day.on .dd,.day.on .dn,.day.on .dm{color:var(--gold)}
.day.past{opacity:.45}

.slot{background:var(--surface);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid transparent}
.slot-in{display:flex;align-items:center;gap:14px;padding:14px 16px}
.slot .t{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.slot .dur{font-size:12px;color:var(--muted)}
.slot .rail{width:3px;align-self:stretch;border-radius:3px;background:var(--gold)}
.slot .what{flex:1;min-width:0}
.slot .what b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .what > span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 16px 12px}
.slot.mine{border-color:var(--ok)}
.slot .foot{background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot.off{opacity:.55}
.slot.blocked .rail{background:var(--muted)}
.slot.taken .rail{background:var(--mag)}

.btn{border:0;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--mag-soft);color:var(--mag);white-space:nowrap}
.btn.solid{background:var(--mag);color:#fff}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.link{background:transparent;padding:4px 0;color:var(--mag)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.mag{background:var(--mag-soft);color:var(--mag)}

.card{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tap{border:0;text-align:left;width:100%}
.card .h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card .h b{font-size:16px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.list{display:flex;flex-direction:column;gap:10px}

/* séances */
.sline{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:11px 14px;border:0;width:100%;text-align:left}
.snum{font-family:var(--display);font-weight:700;font-size:20px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);flex:none;font-variant-numeric:tabular-nums}
.sline.done .snum{background:var(--ink);color:var(--bg)}
.sline.next{outline:2px solid var(--gold)}
.sline .m{flex:1;min-width:0}
.sline .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sline .m span{font-size:12.5px;color:var(--muted)}

/* macro-cycle */
.cyc{display:grid;gap:4px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.ph{height:24px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell{border:0;aspect-ratio:1/1.35;max-width:100%;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-family:var(--display);font-weight:700;font-size:min(17px,calc(1em + 3px));color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
.cell small{font-family:var(--body);font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cell.done{background:var(--ink);color:var(--bg)}
.cell.done small{color:var(--band-muted)}
.cell.next{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.alert::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.phases{display:flex;flex-direction:column;gap:8px}
.phase{display:flex;gap:12px;align-items:flex-start}
.phase .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
.phase b{font-size:15px}
.phase p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.phase.cur b::after{content:"en cours";margin-left:8px;font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 7px;vertical-align:2px}

/* feuille (séance, formulaires) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.sheet-top .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:10px}
.sheet-top h2{font-size:22px;flex:1;min-width:0;text-transform:uppercase}
.sheet-top .x{background:transparent;border:1px solid var(--band-muted);color:var(--band-fg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.sheet main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

.bloc{background:var(--surface);border-radius:14px;overflow:hidden}
.bloc-h{background:var(--band);color:var(--band-fg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px}
.bloc-h b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.bloc-h span{font-size:12px;color:var(--gold)}
.ex{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.how{padding:0 14px 10px 52px;font-size:13.5px;color:var(--muted)}
.how summary{cursor:pointer;color:var(--mag);font-weight:600;font-size:12.5px}
.how p{margin:6px 0 0;white-space:pre-wrap}
.ex .n{flex:1;min-width:0;font-size:14.5px}
.tick{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-weight:700;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex.done .n{color:var(--muted);text-decoration:line-through}
.ex .d{font-weight:700;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.vid{font-size:11px;font-weight:700;letter-spacing:.05em;background:var(--mag);color:#fff;border-radius:6px;padding:4px 8px;text-decoration:none;flex:none}

.note{background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.note.coach{border-left:3px solid var(--gold)}
.note.adh{border-left:3px solid var(--mag)}
.note .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--mag)}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:30px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale button.hot.on{background:var(--warn);border-color:var(--warn);color:#fff}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs-in{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:99px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px}
.tab{border:0;background:transparent;border-radius:99px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--gold-soft);color:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.empty{background:var(--surface);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
@media (prefers-reduced-motion: no-preference){ .slot,.sline,.card{transition:transform .12s} .sline:active,.card.tap:active{transform:scale(.99)} }
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="logo">NN</div>
  <div><h1>Coaching privé</h1><div class="sub">Saint-Médard-en-Jalles</div></div>
  <span class="role" id="role">…</span>
</div></header>
<main id="app"><div class="empty">Chargement du planning…</div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="proj" id="proj" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ---------- constantes ---------- */
const HOURS = {1:[14,15,16,17,18], 3:[14,15,16,17,18], 5:[14,15,16,17,18], 6:[9,10,11]}; // lun, mer, ven, sam
const WEEKS_AHEAD = 6;
const CANCEL_HOURS = 24;
const CAPACITY = 2; // 2 personnes maximum par créneau dans la salle
const DEFAULT_BLOCS = [
  {code:"A1", nom:"Échauffement", tours:"2 tours", exos:[]},
  {code:"A2", nom:"Activation", tours:"2 tours", exos:[]},
  {code:"B1", nom:"Renfo", tours:"3 tours", exos:[]},
  {code:"B2", nom:"Renfo", tours:"3 tours", exos:[]},
  {code:"FIN", nom:"Finisher", tours:"1 tour", exos:[]}];
const DEFAULT_CYCLE = {nom:"Cycle 1", nb:12, debut:"", rythme:"2 séances / semaine", phases:[
  {de:1,a:4,nom:"Fondations",focus:"Mobilité, activation, apprentissage des mouvements"},
  {de:5,a:8,nom:"Développement",focus:"Renfo, surcharge progressive (un seul levier à la fois)"},
  {de:9,a:12,nom:"Intensification & bilan",focus:"Charges, gestes du quotidien, re-bilan en fin de cycle"}]};

/* ---------- état ---------- */
const S = {
  db:null, user:null, uid:null, owner:false, mode:"loading",
  tab:null, week:0, day:null,
  slots:{}, members:{}, membersLoaded:false,
  cur:{mid:null, member:undefined, seances:{}, notes:[]},
  fiche:null, asMember:null, sheet:null, edit:false, drafts:{}, writeBlocked:false
};
let unsubs = [];

/* ---------- utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const keyOf = (d,h) => `${iso(d)}_${pad(h)}`;
function slotDate(k){ const [ds,h] = k.split("_"); const [y,m,d] = ds.split("-").map(Number); return new Date(y,m-1,d,Number(h.slice(0,2)),Number(h.slice(2)||0)); }
const hm = t => `${t.getHours()}h${t.getMinutes() ? pad(t.getMinutes()) : ""}`;
const isCustom = k => k.split("_")[1].length === 4;
/* un créneau a 2 places : document `slots/<clé>` (place 1) et `slots/<clé>~2` (place 2) */
const seatsOf = s => (s && s.seats) || [];
const hasBy = (s, mid) => seatsOf(s).some(x => x.by === mid);
/* un rendez-vous à une heure libre (ex. 14h15) rend indisponibles les créneaux fixes qu'il chevauche */
function overlapOf(k){ const t = slotDate(k), day = k.split("_")[0];
  return Object.keys(S.slots).find(c => isCustom(c) && c.startsWith(day + "_") && S.slots[c].by && Math.abs(slotDate(c) - t) < 36e5) || null; }
function dayKeys(x){ const day = iso(x);
  return [...HOURS[x.getDay()].map(h => keyOf(x,h)), ...Object.keys(S.slots).filter(c => isCustom(c) && c.startsWith(day + "_"))].sort(); }
const heureLbl = h => h ? " · " + h.replace(":", "h") : "";
function parseIso(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
const fmtDay = d => d.toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"});
const fmtLong = d => d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
const fmtSlot = k => `${fmtDay(slotDate(k))} · ${hm(slotDate(k))}`;
const fmtWhen = t => new Date(t).toLocaleString("fr-FR",{day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const initials = s => (s||"?").trim().slice(0,1).toUpperCase();
function d(key, def){ return key in S.drafts ? S.drafts[key] : def; }
function clearDrafts(prefix){ for (const k of Object.keys(S.drafts)) if (k.startsWith(prefix)) delete S.drafts[k]; }

function weekDays(off){
  const n = new Date(); const m = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  m.setDate(m.getDate() - ((m.getDay()+6)%7) + off*7);
  return [0,2,4,5].map(i => { const x = new Date(m); x.setDate(m.getDate()+i); return x; });
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function run(p, ok){
  try { await p; if (ok) toast(ok); return true; }
  catch (e) {
    const c = e && e.code;
    if (c === "permission-denied") toast("Action refusée : créneau déjà pris, ou lien d'accès plus valable.");
    else if (c === "resource-exhausted") toast("Stockage plein : supprime d'anciennes notes.");
    else toast("Pas de connexion pour l'instant, réessaie dans un moment.");
    return false;
  }
}

/* ---------- données ---------- */
const memberId = () => S.asMember || (S.owner ? S.fiche : S.uid);
const isCoachUI = () => S.owner && !S.asMember;
function nextBooking(mid){
  const now = new Date();
  return Object.keys(S.slots).filter(k => hasBy(S.slots[k], mid) && slotDate(k) > now).sort()[0] || null;
}
/* abonnement : abo {prix (€/mois), fin (AAAA-MM-JJ, dernier jour payé ; vide = illimité), offert} */
function aboEtat(m){
  const a = (m && m.abo) || {}, fin = parseIso(a.fin), t = new Date(); t.setHours(0,0,0,0);
  const jours = fin ? Math.round((fin - t) / 864e5) : null;
  return {a, fin, jours, expire: fin ? jours < 0 : false, prix: Number(a.prix) || 0, offert: !!a.offert};
}
const finAbo = fin => fin.toLocaleDateString("fr-FR",{day:"numeric", month:"long"});
function addMonth(isoStr){ const d0 = parseIso(isoStr) || new Date(); const x = new Date(d0.getFullYear(), d0.getMonth()+1, d0.getDate()); return iso(x); }
function aboCard(m, coach){
  const e = aboEtat(m), who = coach ? (m.prenom || "L'adhérent") : null;
  const prix = e.prix ? `${e.prix} €/mois${e.offert ? " · offert pour l'instant" : ""}` : "";
  let cls = "", txt;
  if (!e.fin) txt = e.prix ? `<b>${e.prix} € par mois</b><span>${e.offert ? "Offert pour l'instant." : "Réglé au mois auprès de Nathanael."}</span>` : `<b>Accès illimité</b>`;
  else if (e.expire) { cls = "mag"; txt = coach ? `<b>Abonnement terminé depuis le ${esc(finAbo(e.fin))}</b><span>${esc(who)} doit renouveler pour continuer.</span>`
      : `<b>Ton mois de coaching est terminé (le ${esc(finAbo(e.fin))})</b><span>Pour continuer, règle le mois suivant auprès de Nathanael. Tes séances et tes notes restent là.</span>`; }
  else { if (e.jours <= 7) cls = "warn";
    txt = coach ? `<b>Payé jusqu'au ${esc(finAbo(e.fin))}</b><span>Encore ${e.jours} jour${e.jours>1?"s":""}.${prix ? " " + esc(prix) : ""}</span>`
      : e.jours <= 7 ? `<b>Plus que ${e.jours} jour${e.jours>1?"s":""} de coaching (jusqu'au ${esc(finAbo(e.fin))})</b><span>Pense à recharger tes séances si tu veux qu'on continue ensemble 💪 Vois ça avec Nathanael.</span>`
      : `<b>Coaching réglé jusqu'au ${esc(finAbo(e.fin))}</b><span>Encore ${e.jours} jour${e.jours>1?"s":""}. Pour continuer après, il faudra régler le mois suivant auprès de Nathanael.</span>`; }
  return `<div class="banner ${cls}" style="flex-direction:column;align-items:flex-start;gap:4px">
    <span class="eyebrow" style="color:inherit;opacity:.7">${coach ? "Abonnement" : "Ton abonnement"}${m.forfait ? " · " + esc(m.forfait) : ""}</span>${txt}
    ${coach && e.fin ? `<button class="btn sm ${S.confirmRenew ? "ink" : "solid"}" data-a="renew">${S.confirmRenew ? "Confirmer : +1 mois payé" : "Renouveler : +1 mois"}</button>` : ""}</div>`;
}
const isAuto = s => !!s && s.lieu !== "Salle";
const lieuLbl = s => s?.lieu === "À distance" ? "À distance" : isAuto(s) ? "En autonomie" : "Salle";
const SALLE = "Salle de coaching, Saint-Médard-en-Jalles";
/* lien « ajouter à Google Agenda » (marche sur iPhone et Android, dans l'appli Google Agenda ou le navigateur) */
function gcal(title, start, allDay, details){
  const f = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const ft = d => `${f(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end = new Date(start); if (allDay) end.setDate(end.getDate()+1); else end.setHours(end.getHours()+1);
  const q = new URLSearchParams({action:"TEMPLATE", text:title, dates: allDay ? `${f(start)}/${f(end)}` : `${ft(start)}/${ft(end)}`, ctz:"Europe/Paris", details: details || ""});
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function gcalSlot(k){ const u = new URL(gcal("Coaching privé avec Nathanael", slotDate(k), false, "Séance d'une heure. Pour annuler : dans l'appli, jusqu'à 24 h avant.")); u.searchParams.set("location", SALLE); return u.toString(); }
function gcalSeance(x){ if (!x.date) return null; const st = parseIso(x.date); let all = true;
  if (x.heure) { const [h,mi] = x.heure.split(":").map(Number); st.setHours(h, mi||0); all = false; }
  return gcal(`${x.titre || "Séance"} (${lieuLbl(x).toLowerCase()})`, st, all, "Le programme et les vidéos sont dans l'appli NN Coaching."); }
const hiddenFor = s => isAuto(s) && !s.visible;
function allSeances(){ return Object.entries(S.cur.seances).map(([id,v]) => ({id, ...v})).sort((a,b) => a.num - b.num); }
function seancesSorted(){ return allSeances().filter(s => isCoachUI() || !hiddenFor(s)); }
function nextSeance(list){ return list.find(s => s.statut !== "faite") || null; }
function hasAlert(s){ const r = s.ressenti || {}; return (r.pendant ?? 0) > 3 || (r.lendemain ?? 0) > 3 || r.gonfle; }
function phaseOf(cycle, num){ return (cycle?.phases || []).findIndex(p => num >= p.de && num <= p.a); }

function watch(mid){
  unsubs.forEach(u => u()); unsubs = [];
  S.cur = {mid, member:undefined, seances:{}, notes:[]};
  if (!mid || !S.db) return;
  const base = "members/" + mid;
  unsubs.push(S.db.doc(base).onSnapshot(s => { S.cur.member = s.exists ? s.data() : null; render(); }, () => {}));
  unsubs.push(S.db.collection(base + "/seances").onSnapshot(q => { const o = {}; q.docs.forEach(x => o[x.id] = x.data()); S.cur.seances = o; render(); }, () => {}));
  unsubs.push(S.db.collection(base + "/notes").orderBy("at").limit(500).onSnapshot(q => { S.cur.notes = q.docs.map(x => ({id:x.id, ...x.data()})); render(); }, () => {}));
}

/* ---------- rendu ---------- */
let pending = false;
function render(force){
  const a = document.activeElement;
  if (!force && a && a.dataset && a.dataset.d !== undefined) { pending = true; return; }
  pending = false;
  $("role").textContent = S.mode !== "ready" ? "" : isCoachUI() ? "Coach" : S.asMember ? "Aperçu" : "Adhérent";
  $("app").innerHTML = view();
  renderTabs();
  renderSheet();
}
document.addEventListener("focusout", () => { if (pending) setTimeout(() => { if (pending) render(); }, 450); });

function view(){
  if (S.mode === "loading") return `<div class="empty">Chargement du planning…</div>`;
  if (S.mode === "login") return `<section class="sec"><h2>Bienvenue</h2>
    <div class="card"><b>Tu es adhérent·e ?</b><span class="small muted">Ouvre le lien perso que Nathanael t'a envoyé par texto. Si tu es dans l'appli de l'écran d'accueil, copie ce lien depuis le texto et colle-le ici (une seule fois) :</span>
      <input type="url" id="pl" data-d="pl.link" placeholder="Colle ton lien ici" value="${esc(d("pl.link",""))}" autocomplete="off">
      <button class="btn solid" data-a="paste-link">Ouvrir mon espace</button></div>
    <div class="card"><b>Espace coach</b><button class="btn solid" data-a="coach-login">Se connecter avec Google</button>${S.loginErr ? `<span class="small" style="color:var(--warn)">${esc(S.loginErr)}</span>` : ""}</div></section>`;
  if (S.mode === "badlink") return `<div class="empty">Ce lien n'est plus valable. Demande un nouveau lien à Nathanael.</div>`;
  if (S.mode === "offline") return `<div class="empty">Impossible de se connecter pour l'instant. Vérifie ta connexion internet, puis rouvre l'appli.${S.err ? `<br><span class="small muted">(${esc(S.err)})</span>` : ""}</div>`;
  if (S.mode === "noanon") return `<div class="empty">L'accès par lien n'est pas encore activé. Préviens Nathanael (Firebase › Authentication › Connexion anonyme).</div>`;
  let pre = "";
  if (S.asMember) pre = `<div class="banner mag"><span>Tu vois l'appli comme <b>${esc(S.members[S.asMember]?.prenom || "l'adhérent")}</b>. Ce que tu écris ici est signé « Coach ».</span><button class="btn sm solid" data-a="exit-preview">Revenir en coach</button></div>`;
  if (isCoachUI()) {
    if (S.tab === "planning") return pre + planning(true);
    if (S.tab === "adherents") return pre + (S.fiche ? fiche() : adherents());
  }
  // adhérent
  if (!S.asMember && !S.uid) return `<div class="empty">Ouvre l'appli avec ton lien perso (celui reçu par texto) pour réserver tes séances.</div>` + planning(false);
  if (S.cur.member === undefined) return pre + `<div class="empty">Chargement de ton espace…</div>`;
  if (S.cur.member === null) return pre + onboarding();
  const abo = `<section class="sec">${aboCard(S.cur.member, false)}</section>`;
  if (S.tab === "reserver") return pre + abo + mesRdv() + planning(false);
  if (S.tab === "seances") return pre + abo + seancesView();
  if (S.tab === "cycle") return pre + cycleView(S.cur.member, true);

/* --- planning --- */
function planning(coach){
  const days = weekDays(S.week), today = iso(new Date()), now = new Date();
  if (!S.day || !days.some(x => iso(x) === S.day)) S.day = iso(days.find(x => iso(x) >= today) || days[0]);
  const lbl = S.week === 0 ? "Cette semaine" : S.week === 1 ? "Semaine prochaine" : `Semaine du ${days[0].toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`;
  const dayBtns = days.map(x => {
    const ks = dayKeys(x);
    const free = ks.filter(k => { const s = S.slots[k]; return !isCustom(k) && slotDate(k) > now && !(s && (s.blocked || seatsOf(s).length >= CAPACITY)) && !overlapOf(k); }).length;
    const booked = ks.reduce((n, k) => n + seatsOf(S.slots[k]).length, 0);
    const info = iso(x) < today ? "" : coach ? (booked ? `${booked} rdv` : "") : (free ? `${free} libre${free>1?"s":""}` : "complet");
    return `<button class="day ${iso(x)===S.day?"on":""} ${iso(x)<today?"past":""}" data-a="day" data-v="${iso(x)}">
      <span class="dn">${x.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}</span>
      <span class="dd">${x.getDate()}</span><span class="dm">${x.toLocaleDateString("fr-FR",{month:"short"})}</span>
      <span class="dc">${info || "&nbsp;"}</span></button>`;
  }).join("");
  const dd = parseIso(S.day);
  const slots = dayKeys(dd).map(k => slotCard(k, coach)).join("");
  return `<section class="sec">
    <div class="sec-h"><h2>${coach ? "Mon planning" : "Réserver une séance"}</h2><span class="eyebrow">60 min · salle</span></div>
    <div class="weeknav"><button class="iconbtn" data-a="week" data-v="-1" ${S.week<=0?"disabled":""} aria-label="Semaine précédente">‹</button>
      <span class="lbl">${lbl}</span>
      <button class="iconbtn" data-a="week" data-v="1" ${S.week>=WEEKS_AHEAD?"disabled":""} aria-label="Semaine suivante">›</button></div>
    <div class="days">${dayBtns}</div>
    <div class="eyebrow" style="margin-top:4px">${esc(fmtLong(dd))}</div>
    <div class="list">${slots}</div>
    ${coach && S.day >= today ? `<button class="btn ghost" data-a="custom-open">+ Rendez-vous à une autre heure</button>` : ""}
    ${coach ? "" : `<p class="small muted" style="margin:0">Annulation possible jusqu'à ${CANCEL_HOURS} h avant la séance. Après, préviens Nathanael directement.</p>`}
  </section>`;
}

function slotCard(k, coach){
  const s = S.slots[k] || {}, seats = seatsOf(s), n = seats.length, full = n >= CAPACITY;
  const t = slotDate(k), past = t < new Date(), me = memberId();
  const h = `${pad(t.getHours())}:${pad(t.getMinutes())}`, ov = !n && !s.blocked ? overlapOf(k) : null;
  const jauge = `<span class="chip ${full ? "" : n ? "gold" : "ok"}" style="padding:1px 8px;margin-right:6px;font-size:12px">${n}/${CAPACITY}</span>`;
  let cls = "", right = "", foot = "", who = "À la salle";
  if (ov) { cls = "blocked off"; who = coach ? `Pris par le rdv de ${hm(slotDate(ov))}` : "Indisponible"; }
  else if (coach) {
    if (s.blocked) { cls = "blocked"; who = "Créneau bloqué"; right = past ? "" : `<button class="btn sm ghost" data-a="unblock" data-k="${k}">Débloquer</button>`; }
    else {
      if (full) cls = "taken";
      who = n ? `${jauge} ` + seats.map(x => { const m = S.members[x.by]; return m ? `<b style="display:inline;font-size:inherit;color:var(--ink)">${esc(m.prenom)}</b>` : "Adhérent"; }).join(" + ")
              : `${jauge} ${past ? "Libre" : "À la salle"}`;
      right = seats.map(x => { const m = S.members[x.by];
        return `${m ? `<button class="btn sm" data-a="open-member" data-v="${esc(x.by)}">Fiche ${esc(m.prenom)}</button>` : ""}${past ? "" : `<button class="btn sm ghost" data-a="free" data-doc="${esc(x.doc)}">Libérer${m ? " " + esc(m.prenom) : ""}</button>`}`; }).join("");
      if (n) right += `<button class="btn sm ink" data-a="project" data-v="slot" data-k="${k}">▶ Projeter</button>`;
      if (!past && !full) right += `<button class="btn sm solid" data-a="bookfor" data-k="${k}">+ Placer</button>` + (n ? "" : `<button class="btn sm ghost" data-a="block" data-k="${k}">Bloquer</button>`);
      if (right) right = `<div class="row">${right}</div>`;
    }
  } else {
    if (!s.blocked) who = `${jauge} ${n === 0 ? "Personne pour l'instant" : n === 1 ? "1 personne inscrite" : "Complet"}`;
    if (hasBy(s, me)) { cls = "mine"; const canCancel = (t - new Date()) / 36e5 > CANCEL_HOURS;
      who = `${jauge} ${n === 1 ? "Personne d'autre pour l'instant" : "Une autre personne sera là"}`;
      foot = `<div class="foot"><span>✓ Réservé</span><a class="btn sm link" href="${esc(gcalSlot(k))}" target="_blank" rel="noopener">+ Google Agenda</a>${canCancel ? `<button class="btn sm link" data-a="cancel" data-k="${k}">Annuler</button>` : `<span class="small">${past ? "" : "moins de 24 h"}</span>`}</div>`; }
    else if (full || s.blocked) { cls = "taken"; right = `<span class="chip">${s.blocked ? "Indisponible" : "Complet"}</span>`; }
    else if (!past) right = `<button class="btn sm" data-a="book" data-k="${k}" ${S.writeBlocked?"disabled":""}>+ Réserver</button>`;
  }
  if (past && !foot && !n) cls += " off";
  const tap = !coach && right.includes('data-a="book"') ? ` data-a="book" data-k="${k}" role="button" style="cursor:pointer"` : "";
  return `<div class="slot ${cls}"${tap}><div class="slot-in">
    <div><div class="t">${h}</div><div class="dur">60 min</div></div><div class="rail"></div>
    <div class="what"><b>${coach ? "Coaching privé" : "Coaching"}</b><span>${who}</span></div>${coach ? "" : right}</div>${coach && right ? `<div class="acts">${right}</div>` : ""}${foot}</div>`;
}

function mesRdv(){
  const mid = memberId(), now = new Date();
  const ks = Object.keys(S.slots).filter(k => hasBy(S.slots[k], mid) && slotDate(k) > now).sort();
  const today = iso(now);
  const auto = allSeances().filter(x => isAuto(x) && !hiddenFor(x) && x.statut !== "faite" && x.date && x.date >= today);
  if (!ks.length && !auto.length) return "";
  return `<section class="sec"><div class="eyebrow">Tes prochains rendez-vous</div>
    <div class="row">${ks.map(k => `<span class="chip ok">✓ ${esc(fmtSlot(k))} · avec Nathanael</span>`).join("")}
    ${auto.map(x => `<button class="chip gold" style="border:0" data-a="open-seance" data-v="${x.id}">${esc(x.titre || "Séance en autonomie")} · ${esc(fmtDay(parseIso(x.date)))}${esc(heureLbl(x.heure))}</button>`).join("")}</div></section>`;
}

/* --- adhérents (coach) --- */

  return `<section class="sec"><div class="sec-h"><h2>Mes adhérents</h2><button class="btn sm solid" data-a="add-member">+ Ajouter</button></div>
    ${S.membersLoaded && !list.length ? `<div class="empty">Aucun adhérent pour l'instant. Ajoute une fiche avec « + Ajouter », puis envoie-lui son lien d'accès.</div>
      <div class="card"><b>Reprendre Flo, Mélanie et Audrey</b><span class="small muted">Choisis le fichier d'import que Claude t'a envoyé, puis colle le mot de passe.</span>
      <input type="file" id="impf" accept=".enc,application/octet-stream">
      <input type="text" id="imp" data-d="imp.pw" autocomplete="off" placeholder="Mot de passe" value="${esc(d("imp.pw",""))}"><button class="btn solid" data-a="import">Importer</button></div>` : `<div class="list">${cards}</div>
      <details class="card"><summary class="small">Mettre à jour depuis un fichier d'import</summary><span class="small muted">Les fiches existantes (même prénom) sont complétées, sans doublon. Coches, ressentis et notes sont gardés.</span>
      <input type="file" id="impf" accept=".enc,application/octet-stream">
      <input type="text" id="imp" data-d="imp.pw" autocomplete="off" placeholder="Mot de passe" value="${esc(d("imp.pw",""))}"><button class="btn solid" data-a="import">Importer</button></details>`}
    <p class="small muted" style="margin:0">Les fiches, séances et notes de chaque adhérent ne sont visibles que par toi et par lui. Les autres adhérents voient seulement si un créneau est pris.</p>
    <button class="btn ghost" data-a="logout">Se déconnecter</button></section>`;
}

function fiche(){
  const m = S.cur.member;
  if (m === undefined) return `<div class="empty">Chargement…</div>`;
  if (m === null) return `<div class="empty">Cette fiche n'existe plus. <button class="btn sm" data-a="back">Retour</button></div>`;
  const nb = nextBooking(S.fiche), list = seancesSorted();
  const recent = S.cur.notes.filter(n => n.auteur === "adherent").slice(-3).reverse();
  return `<div class="row"><button class="btn sm ghost" data-a="back">‹ Adhérents</button></div>
  <section class="sec"><div class="h row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(m.prenom))}</span>
    <div style="min-width:0;flex:1"><h2 style="font-size:28px">${esc(m.prenom)}</h2><div class="small muted">${esc(m.objectif || "")}</div></div></div>
    <div class="row">${nb ? `<span class="chip ok">Prochain rdv : ${esc(fmtSlot(nb))}</span>` : `<span class="chip">Aucun rdv à venir</span>`}
      <span class="chip ${m.manual ? "" : "ok"}">${m.manual ? "Fiche coach" : "Compte relié"}</span></div>
    <div class="row"><button class="btn sm" data-a="preview">Voir son appli</button><button class="btn sm ghost" data-a="edit-member">Modifier la fiche</button>
</div></section>
  <section class="sec"><div class="card"><b>Son lien d'accès</b>
    ${m.code ? `<span class="small muted">À envoyer par texto. Elle l'ouvre et l'ajoute à son écran d'accueil, sans compte ni mot de passe.</span>
      <input type="text" id="lk" readonly value="${esc(accessLink(m.code))}" onclick="this.select()">
      <div class="row"><button class="btn sm solid" data-a="copy-link">Copier le lien</button><button class="btn sm ghost" data-a="new-code">${S.confirmCode ? "Confirmer : l'ancien lien ne marchera plus" : "Nouveau lien"}</button></div>`
    : `<span class="small muted">Pas encore de lien pour cette fiche.</span><div class="row"><button class="btn sm solid" data-a="new-code">Créer son lien</button></div>`}</div></section>
  <section class="sec">${aboCard(m, true)}</section>
  ${recent.length ? `<section class="sec"><div class="eyebrow">Derniers messages de ${esc(m.prenom)}</div>${recent.map(noteHtml).join("")}</section>` : ""}
  ${cycleView(m, false)}
  `;
}

/* --- espace adhérent --- */
function onboarding(){
  return `<section class="sec"><h2>Bienvenue !</h2>
    <p style="margin:0">Crée ton espace pour réserver tes séances avec Nathanael et suivre ton programme. Seuls toi et ton coach voient ton suivi.</p>
    <label class="f">Ton prénom<input type="text" id="ob-p" data-d="ob.prenom" value="${esc(d("ob.prenom",""))}" autocomplete="given-name"></label>
    <label class="f">Ton objectif, en une phrase<textarea id="ob-o" data-d="ob.objectif">${esc(d("ob.objectif",""))}</textarea></label>
    <button class="btn solid" data-a="register">Créer mon espace</button>
    ${S.writeBlocked ? `<div class="banner warn">Ton accès à l'appli est en lecture seule. Demande à Nathanael de t'ajouter avec le droit de modifier.</div>` : ""}</section>`;
}

function seancesView(){
  const list = seancesSorted(), nx = nextSeance(list), m = S.cur.member, nxAll = nextSeance(allSeances());
  const waiting = nxAll && hiddenFor(nxAll) ? `<div class="card" style="border:2px dashed var(--line)"><span class="eyebrow">Séance ${nxAll.num} · en autonomie</span>
    <span>Elle sera disponible ici après ta séance avec Nathanael : vous faites le point ensemble, puis il l'ajuste pour toi.</span></div>` : "";
  if (!list.length && waiting) return `<section class="sec"><h2>Mes séances</h2>${waiting}</section>`;
  if (!list.length) return `<section class="sec"><h2>Mes séances</h2><div class="empty">Nathanael prépare ton programme. Tes séances apparaîtront ici.</div></section>`;
  return `<section class="sec"><h2>Mes séances</h2>${waiting}
    ${nx && !waiting ? `<button class="card tap" data-a="open-seance" data-v="${nx.id}" style="border:2px solid var(--gold)">
      <span class="eyebrow">Prochaine séance</span><div class="h"><b style="font-family:var(--display);font-size:24px">S${nx.num} · ${esc(nx.titre||"")}</b></div>
      <span class="small muted">${esc(lieuLbl(nx))}${nx.date ? " · " + esc(fmtDay(parseIso(nx.date)) + heureLbl(nx.heure)) : ` · semaine ${nx.semaine||""}`}</span>
      <span class="small" style="color:var(--mag);font-weight:700">Voir le programme et ajouter une note ›</span></button>` : ""}
    <div class="list">${list.map(s => sline(s, nx, m)).join("")}</div></section>`;
}

function sline(s, nx, m){
  const pi = phaseOf(m?.cycle, s.num);
  return `<button class="sline ${s.statut==="faite"?"done":""} ${nx&&nx.id===s.id?"next":""}" data-a="open-seance" data-v="${s.id}">
    <span class="snum">${s.num}</span><span class="m"><b>${esc(s.titre || "Séance " + s.num)}</b>
    <span>${esc(lieuLbl(s))}${s.date ? " · " + esc(fmtDay(parseIso(s.date)) + heureLbl(s.heure)) : s.semaine ? " · sem. " + s.semaine : ""}${pi>=0 ? " · " + esc(m.cycle.phases[pi].nom) : ""}</span></span>
    ${hasAlert(s) ? `<span class="chip warn">À adapter</span>` : s.statut==="faite" ? `<span class="chip ok">Faite</span>` : isCoachUI() && isAuto(s) ? (s.visible ? `<span class="chip mag">Débloquée</span>` : `<span class="chip">Cachée</span>`) : ""}</button>`;
}

/* --- macro-cycle --- */
function cycleView(m, adh){
  const c = m.cycle, list = seancesSorted(), nx = nextSeance(list);
  if (!c) return `<section class="sec"><div class="sec-h"><h2>Macro-cycle</h2>${adh ? "" : `<button class="btn sm solid" data-a="edit-cycle">Créer le cycle</button>`}</div>
    <div class="empty">${adh ? "Ton cycle n'est pas encore prêt." : "Pas encore de cycle pour cet adhérent."}</div>${adh ? "" : seancesBlock(list, nx, m)}</section>`;
  const n = Math.max(1, Number(c.nb) || 12), byNum = {}, locked = {}; list.forEach(s => byNum[s.num] = s);
  allSeances().forEach(s => { if (!byNum[s.num]) locked[s.num] = true; });
  const cols = ["var(--p1)","var(--p2)","var(--p3)","var(--p4)"];
  const curPhase = phaseOf(c, nx ? nx.num : n);
  const bands = (c.phases||[]).map((p,i) => `<div class="ph" style="grid-column:${Math.max(1,p.de)} / ${Math.min(n,p.a)+1};background:${cols[i%4]}" title="${esc(p.nom)}">${esc(p.nom)}</div>`).join("");
  const cells = Array.from({length:n}, (_,i) => { const s = byNum[i+1];
    return `<button class="cell ${s?.statut==="faite"?"done":""} ${nx&&s&&nx.id===s.id?"next":""} ${s&&hasAlert(s)?"alert":""}" ${s ? `data-a="open-seance" data-v="${s.id}"` : "disabled"} aria-label="Séance ${i+1}">
      ${i+1}<small>${s ? (isAuto(s) ? "A" : "S") : locked[i+1] ? "A ·" : ""}</small></button>`; }).join("");
  const done = list.filter(s => s.statut === "faite").length;
  const gen = S.cur.notes.filter(x => !x.seance);
  return `<section class="sec">
    <div class="sec-h"><h2>${adh ? "Mon cycle" : "Macro-cycle"}</h2>${adh ? "" : `<button class="btn sm ghost" data-a="edit-cycle">Modifier</button>`}</div>
    <div class="card"><div class="h"><b>${esc(c.nom)}</b><span class="chip gold">${done} / ${n} faites</span></div>
      <dl class="kv">${m.forfait ? `<dt>Formule</dt><dd>${esc(m.forfait)}</dd>` : ""}<dt>Début</dt><dd>${c.debut ? esc(fmtLong(parseIso(c.debut))) : "à définir"}</dd><dt>Rythme</dt><dd>${esc(c.rythme||"")}</dd></dl>
      <div style="overflow-x:auto"><div class="cyc" style="--n:${n};min-width:${n>16?n*20:0}px;${n>12?"gap:2px;font-size:11px":""}">${bands}${cells}</div></div>
      <div class="legend"><span><i style="background:var(--ink)"></i>faite</span><span><i style="box-shadow:inset 0 0 0 2px var(--gold)"></i>prochaine</span><span><i style="background:var(--warn);border-radius:50%"></i>à adapter</span><span>S salle · A autonomie</span></div>
    </div>
    <div class="phases">${(c.phases||[]).map((p,i) => `<div class="phase ${i===curPhase?"cur":""}"><span class="sw" style="background:${cols[i%4]}"></span>
      <div><b>${esc(p.nom)}</b> <span class="small muted">S${p.de}–S${p.a}</span><p>${esc(p.focus||"")}</p></div></div>`).join("")}</div>
  </section>
  ${adh ? "" : seancesBlock(list, nx, m)}
  <section class="sec"><div class="eyebrow">Notes sur le cycle</div>
    ${gen.length ? gen.map(noteHtml).join("") : `<p class="small muted" style="margin:0">${adh ? "Une douleur, une contrainte d'agenda, un objectif qui change ? Écris-le ici, Nathanael adaptera ton cycle." : "Notes générales (objectifs, contraintes, ajustements du cycle)."}</p>`}
    ${noteForm("")}</section>`;
}
function suiteBlock(list, m){
  const reste = list.filter(x => x.statut !== "faite").length, k = "su.";
  return `<section class="sec"><div class="banner ${reste <= 1 ? "warn" : ""}" style="flex-direction:column;align-items:stretch;gap:8px">
    <b>${reste === 0 ? "Toutes les séances programmées sont faites : prépare la suite." : reste === 1 ? "Plus qu'une séance programmée : prépare la suite." : `Encore ${reste} séances programmées.`}</b>
    <label class="f">Consignes pour les prochaines séances (Claude en tient compte ; si tu ne mets rien, il continue la progression)
      <textarea id="su-c" data-d="${k}consignes" placeholder="Ex. genou mieux, on peut charger ; moins de gainage ; ajouter du haut du corps…">${esc(d(k+"consignes", m.consignes || ""))}</textarea></label>
    <div class="row"><button class="btn sm solid" data-a="save-consignes">Enregistrer les consignes</button></div>
    <details><summary class="small">Ajouter des séances préparées par Claude</summary>
      <span class="small muted">Choisis le fichier .json envoyé par Claude, ou colle le bloc de texte.</span>
      <input type="file" id="su-f" accept=".json,application/json,text/plain">
      <textarea id="su-p" data-d="${k}paste" placeholder="Colle ici le bloc de séances" style="min-height:90px;font-family:ui-monospace,monospace;font-size:12px">${esc(d(k+"paste",""))}</textarea>
      <div class="row"><button class="btn sm solid" data-a="paste-seances">Ajouter ces séances</button></div></details></div></section>`;
}
function seancesBlock(list, nx, m){
  return suiteBlock(list, m) + `<section class="sec"><div class="sec-h"><h2>Séances</h2><button class="btn sm solid" data-a="new-seance">+ Nouvelle</button></div>
    ${list.length ? `<div class="list">${list.map(s => sline(s, nx, m)).join("")}</div>` : `<div class="empty">Aucune séance. « Nouvelle » crée la séance 1 au format A1 / A2 / B1 / B2 / FIN.</div>`}</section>`;
}

/* --- notes --- */
function noteHtml(n){
  const coach = n.auteur === "coach", who = coach ? "Coach" : (S.cur.member?.prenom || "Adhérent");
  const mine = isCoachUI() || S.owner || n.auteur === "adherent";
  return `<div class="note ${coach?"coach":"adh"}"><div class="meta"><b style="color:var(--ink)">${esc(who)}</b><span>${esc(fmtWhen(n.at))}</span>
    ${n.suivante ? `<span class="chip gold">pour la séance suivante</span>` : ""}
    ${mine ? `<button class="btn link sm" style="margin-left:auto;font-size:12px;color:var(--muted)" data-a="del-note" data-v="${esc(n.id)}">Supprimer</button>` : ""}</div>
    <div class="txt">${esc(n.texte)}</div></div>`;
}
function noteForm(sid){
  const k = "note." + (sid || "cycle");
  return `<div class="card"><label class="f">${isCoachUI() || S.owner ? "Ta note de coach" : "Ta note pour Nathanael"}
    <textarea id="nt-${sid||"cycle"}" data-d="${k}.t" placeholder="${sid ? "Ressenti, exercice trop dur ou trop facile, douleur, ce que tu veux changer…" : "Ce qui doit changer dans le cycle…"}">${esc(d(k+".t",""))}</textarea></label>
    ${sid ? `<label class="check"><input type="checkbox" id="nc-${sid}" data-d="${k}.s" ${d(k+".s",true)?"checked":""}> À prendre en compte pour la séance suivante</label>` : ""}
    <div class="row"><button class="btn solid" data-a="send-note" data-v="${sid}" ${S.writeBlocked?"disabled":""}>Envoyer la note</button></div></div>`;
}

/* --- feuilles --- */
function renderSheet(){
  const el = $("sheet"), sh = S.sheet;
  if (!sh) { el.hidden = true; el.innerHTML = ""; document.body.style.overflow = ""; return; }
  let title = "", body = "";
  if (sh.type === "seance") { const s = S.cur.seances[sh.sid]; title = s ? `Séance ${s.num}` : "Séance"; body = s ? seanceBody(sh.sid, s) : `<div class="empty">Séance introuvable.</div>`; }
  if (sh.type === "bookfor") { title = "Placer un adhérent"; body = bookforBody(sh.k); }
  if (sh.type === "cycle") { title = "Macro-cycle"; body = cycleForm(); }
  if (sh.type === "member") { title = sh.mid ? "Modifier la fiche" : "Nouvel adhérent"; body = memberForm(sh.mid); }
  if (sh.type === "custom") { title = "Autre heure"; body = customBody(); }
  if (sh.type === "link") { title = "Relier à une fiche"; body = linkBody(); }
  const keepScroll = !el.hidden && el.dataset.k === sh.type + (sh.sid||"") ? el.scrollTop : 0;
  el.dataset.k = sh.type + (sh.sid||"");
  el.innerHTML = `<div class="sheet-top"><div class="in"><h2>${esc(title)}</h2><button class="x" data-a="close">Fermer</button></div></div><main>${body}</main>`;
  el.hidden = false; el.scrollTop = keepScroll; document.body.style.overflow = "hidden";
}

function seanceBody(sid, s){
  const m = S.cur.member || {}, coach = S.owner, list = seancesSorted();
  const prev = list.filter(x => x.num < s.num).pop();
  const prevNotes = prev ? S.cur.notes.filter(n => n.seance === prev.id && n.suivante) : [];
  const pi = phaseOf(m.cycle, s.num);
  let out = `<section class="sec"><span class="eyebrow">${esc(m.prenom || "")}${pi>=0 ? " · " + esc(m.cycle.phases[pi].nom) : ""}</span>
    <h2 style="font-size:28px">${esc(s.titre || "Séance " + s.num)}</h2>
    <div class="row"><span class="chip">${esc(lieuLbl(s))}</span>${s.date ? `<span class="chip">${esc(fmtLong(parseIso(s.date)) + heureLbl(s.heure))}</span>` : s.semaine ? `<span class="chip">Semaine ${s.semaine}</span>` : ""}
      ${s.statut==="faite" ? `<span class="chip ok">Faite</span>` : `<span class="chip gold">Prévue</span>`}</div></section>`;
  if (coach && isAuto(s) && !s.visible) out += `<section class="sec"><div class="banner ${s.visible ? "" : "mag"}" style="flex-direction:column;align-items:flex-start">
    ${s.visible ? `<span><b>${esc(m.prenom || "L'adhérent")} voit cette séance</b> depuis son appli et peut cocher ses exercices.</span>`
      : `<span><b>${esc(m.prenom || "L'adhérent")} ne voit pas encore cette séance.</b> Après votre séance et le compte rendu, ajuste-la puis débloque-la.</span>`}
    <div class="row">${s.visible ? `<button class="btn sm ghost" data-a="visible" data-v="${sid}" data-k="0">Cacher à nouveau</button>`
      : `<button class="btn sm ghost" data-a="edit-blocs">Ajuster</button><button class="btn sm solid" data-a="visible" data-v="${sid}" data-k="1">Débloquer pour ${esc(m.prenom || "l'adhérent")}</button>`}</div></div></section>`;
  if (coach && !isAuto(s)) { const nxt = allSeances().find(x => x.num > s.num);
    if (nxt && isAuto(nxt) && !nxt.visible) out += `<section class="sec"><div class="banner" style="flex-direction:column;align-items:flex-start">
      <span><b>Après le compte rendu :</b> prépare la séance ${nxt.num} en autonomie à partir de ce que vous venez de dire, puis débloque-la.</span>
      <button class="btn sm solid" data-a="prep-auto" data-v="${nxt.id}">Préparer la séance ${nxt.num}</button></div></section>`; }
  if (isAuto(s) && (coach || s.visible) && s.statut !== "faite") { const pk = "pl." + sid + ".";
    out += `<section class="sec"><div class="card"><b>Quand vas-tu la faire ?</b>
      <span class="small muted">Choisis le jour et l'heure qui t'arrangent, même en dehors des créneaux de Nathanael.</span>
      <div class="grid3"><label class="f" style="grid-column:span 2">Jour<input type="date" id="pd-${sid}" data-d="${pk}date" value="${esc(d(pk+"date", s.date||""))}"></label>
      <label class="f">Heure<input type="time" id="ph-${sid}" data-d="${pk}heure" value="${esc(d(pk+"heure", s.heure||""))}"></label></div>
      <div class="row"><button class="btn solid" data-a="plan" data-v="${sid}" ${S.writeBlocked?"disabled":""}>${s.date ? "Changer la date" : "Programmer"}</button>
      ${gcalSeance(s) ? `<a class="btn ghost" href="${esc(gcalSeance(s))}" target="_blank" rel="noopener">+ Google Agenda</a>` : ""}</div></div></section>`; }
  if (prev && (prevNotes.length || hasAlert(prev))) {
    const r = prev.ressenti || {};
    out += `<section class="sec"><div class="banner ${hasAlert(prev)?"warn":""}" style="flex-direction:column;align-items:flex-start">
      <b>À prendre en compte (séance ${prev.num})</b>
      ${hasAlert(prev) ? `<span>Ressenti : douleur ${r.pendant ?? "–"}/10 pendant, ${r.lendemain ?? "–"}/10 le lendemain${r.gonfle ? ", genou gonflé" : ""}. Règle : 3/10 max, sinon on réduit l'amplitude ou on reprend la séance d'avant.</span>` : ""}
      ${prevNotes.map(n => `<span>« ${esc(n.texte)} » <span class="muted small">(${n.auteur==="coach"?"coach":esc(m.prenom||"adhérent")})</span></span>`).join("")}</div></section>`;
  }
  if (S.edit && coach) out += blocsForm(s);
  else {
    const co = s.coches || {}, tot = (s.blocs||[]).reduce((t,b) => t + (b.exos||[]).length, 0);
    const nbOk = (s.blocs||[]).reduce((t,b,bi) => t + (b.exos||[]).filter((_,ei) => co[bi+"-"+ei]).length, 0);
    out += `<section class="sec"><div class="sec-h"><h2>Programme</h2><div class="row">${tot ? `<button class="btn sm ink" data-a="project" data-v="seance" data-k="${sid}">▶ Projeter</button>` : ""}${coach ? `<button class="btn sm ghost" data-a="edit-blocs">Modifier</button>` : tot ? `<span class="chip ${nbOk===tot?"ok":""}">${nbOk} / ${tot} cochés</span>` : ""}</div></div>
      ${tot ? `<p class="small muted" style="margin:0">« Projeter » affiche la séance en grand, fond noir, pour un écran ou une télé pendant que tu la fais.</p>` : ""}
      ${!coach && tot ? `<p class="small muted" style="margin:0">Coche chaque exercice quand tu as fini tous ses tours.</p>` : ""}
      ${(s.blocs||[]).map((b,bi) => `<div class="bloc"><div class="bloc-h"><b>${esc(b.code)}${b.nom ? " · " + esc(b.nom) : ""}</b><span>${esc(b.tours||"")}</span></div>
        ${(b.exos||[]).length ? b.exos.map((e,ei) => `<div class="ex ${co[bi+"-"+ei]?"done":""}"><button class="tick ${co[bi+"-"+ei]?"on":""}" data-a="coche" data-v="${sid}" data-k="${bi}-${ei}" aria-label="Cocher ${esc(e.n)}" aria-pressed="${co[bi+"-"+ei]?"true":"false"}">✓</button><span class="n">${esc(e.n)}</span><span class="d">${esc(e.d||"")}</span>${/^https:\/\//.test(e.v||"") ? `<a class="vid" href="${esc(e.v)}" target="_blank" rel="noopener">VIDÉO</a>` : ""}</div>${e.c ? `<details class="how"><summary>Comment faire</summary><p>${esc(e.c)}</p></details>` : ""}`).join("") : `<div class="ex"><span class="n muted">À compléter</span></div>`}</div>`).join("")}</section>`;
  }
  // ressenti
  const r = s.ressenti || {}, k = "rs." + sid + ".";
  const sc = (f, hot) => `<div class="scale">${Array.from({length:11},(_,i) => `<button class="${d(k+f, r[f])===i?"on":""} ${hot&&i>3?"hot":""}" data-a="scale" data-f="${k+f}" data-v="${i}">${i}</button>`).join("")}</div>`;
  out += `<section class="sec"><h2>Ressenti</h2><div class="card">
    <label class="f">Effort ressenti (0 = rien, 10 = maximal)</label>${sc("rpe")}
    <label class="f">Douleur pendant la séance /10</label>${sc("pendant", true)}
    <label class="f">Douleur le lendemain matin /10</label>${sc("lendemain", true)}
    <label class="check"><input type="checkbox" id="gf-${sid}" data-d="${k}gonfle" ${d(k+"gonfle", !!r.gonfle)?"checked":""}> Genou gonflé ou qui se dérobe</label>
    <p class="small muted" style="margin:0">Règle : 3/10 maximum pendant l'effort, et pas plus mal le lendemain. Si le genou gonfle, se bloque ou se dérobe plus souvent : avis médical.</p>
    <div class="row"><button class="btn solid" data-a="save-ressenti" data-v="${sid}" ${S.writeBlocked?"disabled":""}>Enregistrer le ressenti</button>
    ${coach ? `<button class="btn ${s.statut==="faite"?"ghost":"ink"}" data-a="toggle-faite" data-v="${sid}">${s.statut==="faite" ? "Remettre en prévue" : "Marquer comme faite"}</button>`
      : s.statut !== "faite" ? `<button class="btn ink" data-a="toggle-faite" data-v="${sid}">J'ai terminé ma séance</button>` : ""}</div></div></section>`;

}

/* ---------- actions ---------- */
document.addEventListener("input", e => { const k = e.target.dataset?.d; if (k !== undefined) S.drafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; });
document.addEventListener("change", e => { const k = e.target.dataset?.d; if (k !== undefined) S.drafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  act(t.dataset.a, t.dataset).then(() => render(true));
});

async function act(a, ds){
  const db = S.db, v = ds.v, k = ds.k;
  switch (a) {
    case "tab": S.tab = v; S.sheet = null; if (isCoachUI()) { S.fiche = null; watch(null); } window.scrollTo(0,0); break;
    case "week": S.week = Math.max(0, Math.min(WEEKS_AHEAD, S.week + Number(v))); S.day = null; break;
    case "day": S.day = v; break;
    case "book": return book(k);
    case "cancel": {
      const seat = seatsOf(S.slots[k]).find(x => x.by === memberId()); if (!seat) return;
      if ((slotDate(k) - new Date())/36e5 <= CANCEL_HOURS && !S.owner) { toast("Moins de 24 h : préviens Nathanael directement."); return; }
      await run(db.doc("slots/" + seat.doc).delete(), "Réservation annulée"); return; }
    case "block": await run(db.doc("slots/" + k).set({blocked:true, at:Date.now()}), "Créneau bloqué"); return;
    case "unblock": await run(db.doc("slots/" + k).delete(), "Créneau débloqué"); return;
    case "free": await run(db.doc("slots/" + ds.doc).delete(), "Place libérée"); return;
    case "bookfor": S.sheet = {type:"bookfor", k}; return;
    case "renew": { if (!S.confirmRenew) { S.confirmRenew = true; setTimeout(() => { S.confirmRenew = false; render(true); }, 5000); return; } S.confirmRenew = false;
      const e = aboEtat(S.cur.member), fin = addMonth(e.fin && !e.expire ? e.a.fin : iso(new Date(Date.now() - 864e5)));
      await run(db.doc("members/" + S.fiche).update({"abo.fin": fin}), `Renouvelé jusqu'au ${finAbo(parseIso(fin))}`); return; }
    case "project": return project(v, k);
    case "proj-close": closeProj(); return;
    case "pickfor": { const ok = await claim(k, v); if (ok) { S.sheet = null; toast(`${S.members[v]?.prenom || "Adhérent"} placé·e ${fmtSlot(k)}`); } return; }
    case "open-member": S.tab = "adherents"; S.fiche = v; S.sheet = null; watch(v); window.scrollTo(0,0); return;
    case "back": S.fiche = null; watch(null); return;
    case "preview": S.asMember = S.fiche; S.tab = "seances"; window.scrollTo(0,0); return;
    case "exit-preview": S.fiche = S.asMember; S.asMember = null; S.tab = "adherents"; S.sheet = null; return;
    case "open-seance": S.sheet = {type:"seance", sid:v}; S.edit = false; S.confirmDel = null; return;
    case "close": S.sheet = null; S.edit = false; return;
    case "edit-blocs": S.edit = true; return;
    case "copy-link": { const v2 = accessLink(S.cur.member?.code);
      try { await navigator.clipboard.writeText(v2); toast("Lien copié"); } catch (e) { const i = $("lk"); if (i) { i.focus(); i.select(); } toast("Sélectionne le lien et copie-le"); } return; }
    case "new-code": { const m = S.cur.member; if (m?.code && !S.confirmCode) { S.confirmCode = true; return; }
      S.confirmCode = false; const code = rid(22), b = db.batch();
      b.set(db.doc("codes/" + code), {cid: S.fiche}); b.update(db.doc("members/" + S.fiche), {code});
      if (m?.code) b.delete(db.doc("codes/" + m.code));
      await run(b.commit(), "Nouveau lien créé"); return; }
    case "coach-login": return coachLogin();
    case "paste-link": { const m = String(S.drafts["pl.link"] || "").match(/[?&]c=([A-Za-z0-9]+)/) || String(S.drafts["pl.link"] || "").trim().match(/^([A-Za-z0-9]{16,})$/);
      if (!m) { toast("Ce n'est pas le bon lien : copie tout le lien du texto."); return; }
      try { localStorage.setItem("nn.code", m[1]); } catch (e) {}
      location.href = location.pathname + "?c=" + m[1]; return; }
    case "logout": await firebase.auth().signOut(); try { localStorage.removeItem("nn.code"); } catch (e) {} location.href = location.pathname; return;
    case "import": return importSeed();
    case "custom-open": S.sheet = {type:"custom"}; return;
    case "pickcustom": { const tm = (S.drafts["cu.time"] || "14:15").match(/^(\d{1,2}):(\d{2})/);
      if (!tm) { toast("Indique une heure."); return; }

      if (slotDate(key) < new Date()) { toast("Cette heure est déjà passée."); return; }
      if (await claim(key, v)) { S.sheet = null; toast(`${S.members[v]?.prenom || "Adhérent"} : ${fmtSlot(key)}`); } return; }
    case "plan": { const pk = "pl." + v + ".", sv = S.cur.seances[v] || {};
      const date = S.drafts[pk+"date"] ?? sv.date ?? "", heure = S.drafts[pk+"heure"] ?? sv.heure ?? "";
      if (!date) { toast("Choisis un jour."); return; }
      if (await run(db.doc(`members/${memberId()}/seances/${v}`).update({date, heure}), `Programmée : ${fmtDay(parseIso(date))}${heureLbl(heure)}`)) clearDrafts(pk);
      return; }
    case "prep-auto": S.sheet = {type:"seance", sid:v}; S.edit = true; S.confirmDel = null; return;
    case "visible": await run(db.doc(`members/${memberId()}/seances/${v}`).update({visible: k === "1"}), k === "1" ? `Séance débloquée pour ${S.cur.member?.prenom || "l'adhérent"}` : "Séance cachée"); return;
    case "coche": { const on = !(S.cur.seances[v]?.coches || {})[k];
      await run(db.doc(`members/${memberId()}/seances/${v}`).update({coches: {[k]: on}})); return; }
    case "cancel-edit": S.edit = false; clearDrafts("bl."); return;
    case "save-blocs": return saveBlocs(v);
    case "scale": S.drafts[ds.f] = Number(v); return;
    case "save-ressenti": {
      const p = "rs." + v + ".", r = {...(S.cur.seances[v]?.ressenti || {})};
      for (const f of ["rpe","pendant","lendemain","gonfle"]) if ((p+f) in S.drafts) r[f] = S.drafts[p+f];
      r.at = Date.now(); r.par = S.owner ? "coach" : "adherent";
