      return; }
    case "toggle-faite": { const s = S.cur.seances[v];
      await run(db.doc(`members/${memberId()}/seances/${v}`).update({statut: s.statut === "faite" ? "prevue" : "faite"}), s.statut === "faite" ? "Séance remise en prévue" : "Séance marquée comme faite"); return; }
    case "del-seance": if (S.confirmDel !== v) { S.confirmDel = v; return; }
      if (await run(db.doc(`members/${memberId()}/seances/${v}`).delete(), "Séance supprimée")) { S.sheet = null; S.confirmDel = null; } return;
    case "send-note": {
      const p = "note." + (v || "cycle"), txt = (S.drafts[p + ".t"] || "").trim();
      if (!txt) { toast("Écris d'abord ta note."); return; }
      const doc = {seance: v || null, auteur: S.owner ? "coach" : "adherent", texte: txt.slice(0, 4000), at: Date.now(), suivante: v ? (S.drafts[p + ".s"] ?? true) : false};
      if (await run(db.collection(`members/${memberId()}/notes`).add(doc), "Note envoyée")) clearDrafts(p);
      return; }
    case "del-note": await run(db.doc(`members/${memberId()}/notes/${v}`).delete(), "Note supprimée"); return;
    case "new-seance": return newSeance();
    case "save-consignes": if (await run(db.doc("members/" + S.fiche).update({consignes: (S.drafts["su.consignes"] ?? "").trim().slice(0, 3000), consignesAt: Date.now()}), "Consignes enregistrées")) clearDrafts("su.consignes"); return;
    case "paste-seances": return pasteSeances();
    case "edit-cycle": S.sheet = {type:"cycle"}; clearDrafts("cy."); return;
    case "save-cycle": return saveCycle();
    case "add-member": S.sheet = {type:"member"}; clearDrafts("mb."); return;
    case "edit-member": S.sheet = {type:"member", mid:S.fiche}; clearDrafts("mb."); return;
    case "save-member": return saveMember(v);
    case "register": {
      const p = (S.drafts["ob.prenom"] || "").trim();
      if (!p) { toast("Indique ton prénom."); return; }
      await run(db.doc("members/" + S.uid).set({prenom:p.slice(0,40), objectif:(S.drafts["ob.objectif"]||"").trim().slice(0,400), manual:false, createdAt:Date.now(), cycle:null}), "Ton espace est prêt");
      S.tab = "reserver"; return; }
    case "link-open": S.sheet = {type:"link"}; return;
    case "link-do": return linkTo(v);
  }
}

async function claim(k, mid){
  const s = S.slots[k]; toast("Réservation en cours…");
  if (s?.blocked) { toast("Ce créneau est indisponible."); return false; }
  if (hasBy(s, mid)) { toast("Déjà inscrit·e sur ce créneau."); return false; }
  /* place 1 puis place 2 : les règles n'autorisent que la création, donc si quelqu'un prend la place entre-temps l'écriture est refusée */
  for (const id of [k, k + "~2"]) {
    const ref = S.db.doc("slots/" + id);
    try { if ((await ref.get()).exists) continue; } catch (e) {}
    return run(ref.set({by: mid, at: Date.now()}));
  }
  toast(`Ce créneau est complet (${CAPACITY} personnes maximum).`); return false;
}
async function book(k){
  if (slotDate(k) < new Date()) return;
  const e = aboEtat(S.cur.member);
  if (e.fin && slotDate(k) >= new Date(e.fin.getFullYear(), e.fin.getMonth(), e.fin.getDate() + 1)) {
    toast(e.expire ? "Ton mois est terminé : vois avec Nathanael pour continuer." : `Ton mois se termine le ${finAbo(e.fin)} : renouvelle-le avec Nathanael pour réserver après.`); return; }
  if (await claim(k, memberId())) toast(`Réservé : ${fmtSlot(k)}`);
}

/* --- projection fond noir --- */
function tCourt(t){ t = String(t || "");
  const n = t.match(/^(\d+)\s*(tours?|séries?|fois)/i), r = t.match(/(?:repos|récup)\s*(\d+(?:[.,]\d+)?)(?:\s*(?:à|-)\s*(\d+))?\s*(min|sec|s)\b/i);
  const rep = r ? ` r${r[1]}${r[2] ? "-" + r[2] : ""}${/min/i.test(r[3]) ? "'" : '"'}` : "";
  if (n) return `(${n[1]}${/^t/i.test(n[2]) ? "T" : /^s/i.test(n[2]) ? "S" : "x"})${rep}`;
  return t ? `(${t})` : ""; }
function projLines(s){
  return (s.blocs||[]).filter(b => (b.exos||[]).length).map(b => {
    const code = /^fin/i.test(b.code) ? "Fin" : b.code;
    return `<div><b>${esc(code)} ${esc(tCourt(b.tours))} :</b> ${b.exos.map(e => esc(e.n) + (e.d ? " " + esc(e.d) : "")).join(" / ")}</div>`; }).join("");
}
function choisirSeance(list, day){
  const salle = list.filter(x => x.lieu === "Salle").sort((a,b) => a.num - b.num);
  return salle.find(x => x.date === day) || salle.find(x => x.statut !== "faite") || salle[salle.length-1] || null;
}
async function project(kind, k){
  let cols = [];
  if (kind === "seance") { const s = S.cur.seances[k]; if (s) cols = [{prenom: S.cur.member?.prenom || "", s}]; }
  else { const day = k.split("_")[0];
    for (const x of seatsOf(S.slots[k])) {
      try { const q = await S.db.collection(`members/${x.by}/seances`).get();
        const s = choisirSeance(q.docs.map(d => ({id: d.id, ...d.data()})), day);
        cols.push({prenom: S.members[x.by]?.prenom || "Adhérent", s}); } catch (e) {} } }
  if (!cols.length) { toast("Rien à projeter."); return; }
  const el = $("proj");
  el.style.setProperty("--c", cols.length);
  el.innerHTML = `<button class="x" data-a="proj-close">Fermer ✕</button><div class="cols">${cols.map(c => `<div class="box"><h3>${esc(c.prenom)}</h3>
    <div class="lines">${c.s ? `<div class="sub">${esc(c.s.titre || "Séance " + c.s.num)}</div>` + projLines(c.s) : `<div class="sub">Pas de séance en salle prévue.</div>`}</div></div>`).join("")}</div>`;
  el.hidden = false; S.projOn = true; fitProj();
  try { await (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
  try { S.wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
}
/* la police la plus grande possible sans dépasser l'écran */
function fitProj(){ const el = $("proj"); if (el.hidden) return;
  let lo = 12, hi = 72;
  const fits = fs => { el.style.setProperty("--fs", fs + "px"); return [...el.querySelectorAll(".box")].every(b => b.scrollHeight <= b.clientHeight + 1) && el.scrollHeight <= el.clientHeight + 1; };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (fits(mid)) lo = mid; else hi = mid; }
  el.style.setProperty("--fs", lo + "px"); }
window.addEventListener("resize", () => { if (S.projOn) fitProj(); });
document.addEventListener("fullscreenchange", () => { if (S.projOn) setTimeout(fitProj, 100); });
function closeProj(){ const el = $("proj"); el.hidden = true; el.innerHTML = ""; S.projOn = false;
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.webkitFullscreenElement) document.webkitExitFullscreen(); } catch (e) {}
  try { S.wake?.release(); } catch (e) {} S.wake = null; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.projOn) closeProj(); });

async function saveBlocs(sid){
  const s = S.cur.seances[sid], p = "bl." + sid + ".";
  const src = s.blocs && s.blocs.length ? s.blocs : DEFAULT_BLOCS;
  const blocs = src.map((b,i) => {
    const raw = (p+"e"+i) in S.drafts ? S.drafts[p+"e"+i] : null;
    const old = {}; (b.exos||[]).forEach(e => old[e.n] = e);
    const exos = raw === null ? (b.exos||[]) : raw.split("\n").map(l => l.split("|").map(x => x.trim())).filter(x => x[0]).map(([n,dd,vv]) => ({n, d:dd||"", v:/^https:\/\//.test(vv||"") ? vv : "", ...(old[n]?.c ? {c: old[n].c} : {})}));
    return {code: (S.drafts[p+"c"+i] ?? b.code).trim() || b.code, nom: (S.drafts[p+"n"+i] ?? b.nom).trim(), tours: (S.drafts[p+"t"+i] ?? b.tours).trim(), exos};
  }).filter(b => b.code);
  const patch = {blocs, titre: (S.drafts[p+"titre"] ?? s.titre ?? "").trim(), lieu: S.drafts[p+"lieu"] ?? s.lieu ?? "Salle", date: (S.drafts[p+"date"] ?? s.date) || null};
  if (await run(S.db.doc(`members/${memberId()}/seances/${sid}`).update(patch), "Programme enregistré")) { S.edit = false; clearDrafts(p); }
}
/* bloc de séances préparé par Claude : {"seances":[{titre, lieu, semaine, date, blocs:[{code, nom, tours, exos:[{n, d, v, c}]}]}]} */
async function pasteSeances(){
  let arr;
  const f = $("su-f")?.files?.[0];
  try { const raw = f ? (await f.text()).trim() : (S.drafts["su.paste"] || "").trim(); const j = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1)); arr = j.seances || []; if (!arr.length) throw 0; }
  catch (e) { toast("Bloc illisible : recopie-le en entier."); return; }
  const list = seancesSorted(); let num = (list[list.length-1]?.num || 0);
  const str = (x, n) => String(x ?? "").slice(0, n), b = S.db.batch();
  for (const x of arr.slice(0, 30)) { num++;
    const lieu = ["Salle","En autonomie","À distance"].includes(x.lieu) ? x.lieu : "Salle";
    b.set(S.db.doc(`members/${S.fiche}/seances/s${pad(num)}`), {num, titre: str(x.titre || "Séance " + num, 120), lieu, visible: lieu !== "En autonomie", semaine: Number(x.semaine) || null,
      date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : null, heure: "", statut: "prevue",
      blocs: (x.blocs || []).slice(0, 8).map(bl => ({code: str(bl.code, 8), nom: str(bl.nom, 60), tours: str(bl.tours, 80),
        exos: (bl.exos || []).slice(0, 12).map(e => ({n: str(e.n, 120), d: str(e.d, 80), v: /^https:\/\//.test(e.v || "") ? str(e.v, 300) : "", c: str(e.c, 1500)}))}))}); }
  if (await run(b.commit(), `${arr.length} séance${arr.length > 1 ? "s" : ""} ajoutée${arr.length > 1 ? "s" : ""}`)) clearDrafts("su.paste");
}
async function newSeance(){
  const list = seancesSorted(), last = list[list.length-1], num = (last?.num || 0) + 1, id = "s" + pad(num);
  const nb = nextBooking(memberId());
  const auto = !!last && !isAuto(last);
  const doc = {num, titre: auto ? "Séance en autonomie" : `Séance ${num}`, lieu: auto ? "En autonomie" : "Salle", visible: !auto, semaine: null,
    date: auto ? null : nb ? nb.split("_")[0] : null, statut: "prevue",
    blocs: JSON.parse(JSON.stringify(last?.blocs?.length ? last.blocs : DEFAULT_BLOCS))};
  if (await run(S.db.doc(`members/${memberId()}/seances/${id}`).set(doc), `Séance ${num} créée${last ? " (copie de la précédente)" : ""}`)) { S.sheet = {type:"seance", sid:id}; S.edit = true; }
}
async function saveCycle(){
  const c = S.cur.member?.cycle || DEFAULT_CYCLE, p = "cy.";
  const txt = S.drafts[p+"phases"];
  const phases = txt === undefined ? c.phases : txt.split("\n").map(l => l.split("|").map(x => x.trim())).filter(x => x[0]).map(([r,nom,focus]) => {
    const [de,a] = r.split(/[-–]/).map(n => parseInt(n,10)); return {de: de||1, a: a||de||1, nom: nom||"Phase", focus: focus||""}; });
  const cycle = {nom: (S.drafts[p+"nom"] ?? c.nom).trim() || "Cycle", nb: Math.max(1, Math.min(40, parseInt(S.drafts[p+"nb"] ?? c.nb, 10) || 12)),
    debut: S.drafts[p+"debut"] ?? c.debut ?? "", rythme: (S.drafts[p+"rythme"] ?? c.rythme ?? "").trim(), phases};
  if (await run(S.db.doc("members/" + memberId()).update({cycle}), "Cycle enregistré")) { S.sheet = null; clearDrafts(p); }
}
async function saveMember(mid){
  const p = "mb.", prenom = (S.drafts[p+"prenom"] ?? S.cur.member?.prenom ?? "").trim();
  if (!prenom) { toast("Indique un prénom."); return; }
  const objectif = (S.drafts[p+"objectif"] ?? (mid ? S.cur.member?.objectif : "") ?? "").trim();
  const forfait = (S.drafts[p+"forfait"] ?? (mid ? S.cur.member?.forfait : "") ?? "").trim();
  const email = (S.drafts[p+"email"] ?? (mid ? S.cur.member?.email : "") ?? "").trim().slice(0, 120);
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("L'adresse e-mail n'est pas valide."); return; }
  const old = (mid ? S.cur.member?.abo : null) || {}, px = S.drafts[p+"prix"] ?? old.prix ?? "";
  const abo = {prix: px === "" || px === null ? null : Math.max(0, Number(px) || 0), fin: S.drafts[p+"fin"] ?? old.fin ?? "", offert: !!(S.drafts[p+"offert"] ?? old.offert)};
  if (mid) { if (await run(S.db.doc("members/" + mid).update({prenom, objectif, forfait, email, abo}), "Fiche enregistrée")) { S.sheet = null; clearDrafts(p); } return; }
  const id = "m-" + rid(10), code = rid(22), b = S.db.batch();
  b.set(S.db.doc("members/" + id), {prenom, objectif, forfait, email, abo, manual:true, code, createdAt:Date.now(), cycle: {...DEFAULT_CYCLE, debut: iso(new Date())}});
  b.set(S.db.doc("codes/" + code), {cid: id});
  if (await run(b.commit(), `${prenom} ajouté·e`)) {
    S.sheet = null; clearDrafts(p); S.fiche = id; watch(id); }
}
async function linkTo(from){
  const to = S.fiche, db = S.db;
  try {
    const old = (await db.doc("members/" + from).get()).data() || {};
    const cur = S.cur.member || {};
    await db.doc("members/" + to).update({cycle: old.cycle || cur.cycle || null, objectif: cur.objectif || old.objectif || ""});
    for (const col of ["seances","notes"]) {
      const q = await db.collection(`members/${from}/${col}`).get();
      for (const x of q.docs) { await db.doc(`members/${to}/${col}/${x.id}`).set(JSON.parse(JSON.stringify(x.data()))); await db.doc(`members/${from}/${col}/${x.id}`).delete(); }
    }
    for (const s of Object.values(S.slots)) for (const x of seatsOf(s)) if (x.by === from) await db.doc("slots/" + x.doc).update({by: to});
    await db.doc("members/" + from).delete();
    S.sheet = null; toast("Fiches reliées");
  } catch (e) { toast("La liaison n'a pas pu se terminer. Réessaie : rien n'est perdu."); }
}

/* ---------- démarrage ---------- */
const rid = n => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", a = crypto.getRandomValues(new Uint8Array(n)); return Array.from(a, x => c[x % c.length]).join(""); };
const accessLink = code => code ? `${location.origin}${location.pathname}?c=${code}` : "";

async function coachLogin(){
  const auth = firebase.auth(), p = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(p); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") { await auth.signInWithRedirect(p); return; }
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") { S.loginErr = "Connexion impossible : " + (e.message || e.code); render(true); }
  }
}

/* import unique des fiches existantes : le fichier est fourni par le coach (jamais publié), chiffré en AES-GCM avec une clé dérivée du mot de passe */
async function importSeed(){
  const pw = (S.drafts["imp.pw"] || "").trim(); if (!pw) { toast("Colle d'abord le mot de passe."); return; }
  let data;
  try {
    const file = $("impf")?.files?.[0]; if (!file) { toast("Choisis d'abord le fichier d'import."); return; }
    const buf = new Uint8Array(await file.arrayBuffer());
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct)));
  } catch (e) { toast("Mot de passe incorrect."); return; }
  /* une fiche qui existe déjà (même prénom) est complétée au lieu d'être dupliquée */
  const norm = x => String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  const exist = {}; for (const [id, m] of Object.entries(S.members)) exist[norm(m.prenom)] = [id, m];
  const ids = {}, writes = [];
  for (const [old, m] of Object.entries(data.members)) {
    const e = exist[norm(m.prenom)], cid = e ? e[0] : "m-" + rid(10), code = e?.[1].code || rid(22); ids[old] = cid;
    writes.push(["members/" + cid, {...m, code}]); if (!e?.[1].code) writes.push(["codes/" + code, {cid}]);
    if (e) continue; // fiche existante : on met seulement à jour la fiche (formule, abonnement, objectif)
    for (const [sid, x] of Object.entries(data.seances[old] || {})) writes.push([`members/${cid}/seances/${sid}`, x]);
    for (const [nid, x] of Object.entries(data.notes[old] || {})) writes.push([`members/${cid}/notes/${nid}`, x]);
  }
  for (const [k, x] of Object.entries(data.slots || {})) if (!S.slots[k.split("~")[0]]) writes.push(["slots/" + k, {...x, by: ids[x.by] || x.by}]);
  try { for (let i = 0; i < writes.length; i += 400) { const b = S.db.batch(); writes.slice(i, i+400).forEach(([p, v]) => b.set(S.db.doc(p), v, {merge: true})); await b.commit(); } toast("Fiches importées"); clearDrafts("imp."); }
  catch (e) { toast("Import interrompu : " + (e.code || "erreur")); }
}

function startData(isCoach, cid){
  const db = S.db;
  db.collection("slots").limit(2000).onSnapshot(q => { const o = {};
    q.docs.forEach(x => { const v = x.data(), e = o[x.id.split("~")[0]] ??= {seats: []};
      if (v.blocked) e.blocked = true; else if (v.by) { e.seats.push({doc: x.id, by: v.by, at: v.at || 0}); e.by = e.by || v.by; } });
    for (const e of Object.values(o)) e.seats.sort((p, q2) => p.at - q2.at);
    S.slots = o; render(); }, () => {});
  if (isCoach) {
    S.owner = true; S.tab = "planning";
    db.collection("members").limit(500).onSnapshot(q => { const o = {}; q.docs.forEach(x => o[x.id] = x.data()); S.members = o; S.membersLoaded = true; render(); }, () => {});
  } else { S.owner = false; S.uid = cid; S.tab = "reserver"; watch(cid); }
  S.mode = "ready"; render(true);
}

(async function start(){
  render(true);
  if (!window.firebase || !window.FB_CONFIG) { S.mode = "offline"; render(true); return; }
  firebase.initializeApp(window.FB_CONFIG);
  const auth = firebase.auth();
  S.db = firebase.firestore();
  if (location.hostname === "localhost") { auth.useEmulator("http://localhost:9099", {disableWarnings:true}); S.db.useEmulator("localhost", 8080); }
  try { S.db.enablePersistence({synchronizeTabs:true}).catch(() => {}); } catch (e) {}
  const url = new URL(location.href);
  let code = url.searchParams.get("c");
  /* ?coach : l'espace coach, même si un lien d'adhérente a déjà été ouvert sur cet appareil */
  if (url.searchParams.has("coach")) { code = null; try { localStorage.removeItem("nn.code"); } catch (e) {} }
  else try { if (code) localStorage.setItem("nn.code", code); else code = localStorage.getItem("nn.code"); } catch (e) {}
  try { await auth.getRedirectResult(); } catch (e) {}
  let started = false;
  auth.onAuthStateChanged(async u => {
    if (started) return;
    const isCoach = !!u && !u.isAnonymous && (u.email || "").toLowerCase() === String(window.COACH_EMAIL).toLowerCase();
    if (isCoach) { started = true; startData(true);
      /* le coach qui ouvre le lien d'une adhérente : on lui montre l'appli de cette adhérente */
      const cc = url.searchParams.get("c");
      if (cc) { try { const c = await S.db.doc("codes/" + cc).get(); if (c.exists) { S.fiche = c.data().cid; watch(S.fiche); S.asMember = S.fiche; S.tab = "seances"; toast("Tu vois l'appli de ton adhérente (aperçu coach)"); render(true); } } catch (e) {} }
      try { if (cc) localStorage.removeItem("nn.code"); } catch (e) {}
      return; }
    if (u && !u.isAnonymous) { S.mode = "login"; S.loginErr = `${u.email} n'est pas l'adresse du coach.`; await auth.signOut(); render(true); return; }
    if (!code) { S.mode = "login"; render(true); return; }
    try {
      if (!u) { await auth.signInAnonymously(); return; }  /* onAuthStateChanged repasse ici, connecté */
      const c = await S.db.doc("codes/" + code).get();
      if (!c.exists) { S.mode = "badlink"; render(true); return; }
      const cid = c.data().cid;
      await S.db.doc("links/" + u.uid).set({code, cid, at: Date.now()});
      started = true; startData(false, cid);
    } catch (e) { S.mode = e && e.code === "permission-denied" ? "badlink" : /admin-restricted|operation-not-allowed/.test(e && e.code || "") ? "noanon" : "offline"; S.err = e && (e.code || e.message); render(true); }
  });
})();
